  --color-accent-pink:#D98FA5; --color-accent-lilac:#A99BCB; --color-accent-sand:#D9BD91; --color-sand-soft:#F6F0E4;

  /* Nombres anteriores: apuntan a los nuevos tokens para no tocar cada regla ni el JavaScript. */

function bindCr(){const c=$('#cr');if(!c)return;clearTimeout(CR.t);CR.i=0;CR.hold=0;

  <p class="err" id="err"></p>

 if(S.gstep==='created')b=`<h1>¡Listo, ${esc(S.group.name)}!</h1><p class="mu">Comparte el enlace o el código con quien quieras que se una.</p>

async function mk(){const b=$('#mkb');if(!b||b.disabled)return;
 if(!navigator.onLine){gerr('Necesitas internet para crear el grupo.');return}
 b.disabled=true;b.textContent='Creando…';gerr('');
 try{await CLOUD.createFamily($('#gname').value.trim()||GT[S.gtype].dn,S.gtype);S.gname='';S.gstep='created';render()}
 catch(e){b.disabled=false;b.textContent='Crear grupo';gerr('No pudimos crear el grupo. Intenta de nuevo.')}}
async function jn(){const b=$('#jnb'),c=$('#gc').value.trim().toUpperCase();if(!b||b.disabled)return;
 if(c.length<4){gerr('Escribe el código completo.');return}
 if(!navigator.onLine){gerr('Necesitas internet para unirte.');return}
 b.disabled=true;b.textContent='Entrando…';gerr('');
 try{const r=await CLOUD.joinFamily(c);
  if(r.err){b.disabled=false;b.textContent='Unirme';gerr(r.err==='full'?'Ese grupo es de pareja y ya tiene a sus dos personas.':'No encontramos ese código. Revisa que esté bien escrito.');return}
  S.joinCode='';nextScr();toast('Ya eres parte de '+S.group.name+' 💗')}
 catch(e){b.disabled=false;b.textContent='Unirme';gerr('No pudimos unirte. Revisa tu conexión e intenta de nuevo.')}}

 <label class="lb" for="pn">¿Cómo se llama?</label>
 <input id="pn" class="in" maxlength="14" value="${esc(S.pet.name)}" oninput="S.pet.name=this.value;S.pe=1">
 <button class="btn w" onclick="startGame()">Empezar</button></div>`}

function startGame(){S.pet.name=S.pet.name.trim()||PETS[S.pet.kind].n;S.petSet=true;S.scr='main';S.tab='home';render();toast('¡'+S.pet.name+' ya está contigo!')}

function render(){

 if(S.scr==='main'&&$('#mn')){$('#mn').innerHTML=VIEW[S.tab]();$('#hd').innerHTML=hdr();navSync();return}

function enterAnim(m){if(!m)return;[...m.children].forEach((e,i)=>e.style.setProperty('--i',Math.min(i,8)));m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(m._h);m._h=setTimeout(()=>m.classList.remove('enter'),1400)}

/* ---------- semana: misiones y pregunta (cambian cada lunes) ---------- */
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wkKey=()=>{const d=weekStart();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const wkIdx=()=>Math.floor(weekStart().getTime()/(7*864e5));
const WQS=['¿Cuál fue tu peor trabajo?','¿Cuál es el mejor consejo que te han dado?','¿Qué comida te recuerda a tu infancia?','¿Cuál fue el regalo más especial que recibiste?','¿Qué travesura hiciste de niño que nadie sabía?','¿Cómo conociste a tu mejor amigo?','¿Cuál es tu recuerdo favorito de unas vacaciones en familia?','¿Qué canción te hace pensar en casa?','¿Qué te enseñó tu abuela o tu abuelo?','¿Cómo fue tu primer día de colegio o de trabajo?','¿Qué te daba más miedo de pequeño?','¿Qué tradición de tu familia no quieres que se pierda?'];
const wqNow=()=>WQS[wkIdx()%WQS.length];
const MPOOL=[
 {id:'posts3',t:'Cuenta 3 historias esta semana',g:3,r:60,p:w=>w.posts},
 {id:'types3',t:'Cuenta de 3 formas distintas (voz, foto, carta…)',g:3,r:70,p:w=>w.types.length},
 {id:'trivia5',t:'Responde la pregunta del día 5 veces',g:5,r:50,p:w=>w.trivia},
 {id:'mimos5',t:'Dale 5 mimos a tu mascota',g:5,r:40,p:w=>w.mimos},
 {id:'days4',t:'Cuenta algo en 4 días distintos',g:4,r:80,p:w=>w.days.length},
 {id:'voz1',t:'Graba una nota de voz',g:1,r:50,p:w=>w.types.includes('voz')?1:0},
 {id:'receta1',t:'Guarda una receta de la familia',g:1,r:60,p:w=>w.types.includes('receta')?1:0},
 {id:'foto2',t:'Sube 2 fotos',g:2,r:50,p:w=>w.fotos}];
const wkEnsure=()=>{const k=wkKey();if(!S.wk||S.wk.k!==k)S.wk={k,posts:0,fotos:0,types:[],days:[],trivia:0,mimos:0,claimed:[]};return S.wk};
const wkMissions=()=>{const i=wkIdx()%MPOOL.length;return[0,3,6].map(j=>MPOOL[(i+j)%MPOOL.length])};
function track(t,k){const w=wkEnsure();
 if(t==='post'){w.posts++;if(k==='foto')w.fotos++;if(!w.types.includes(k))w.types.push(k);const d=today();if(!w.days.includes(d))w.days.push(d)}
 if(t==='trivia'||t==='qa')w.trivia++;if(t==='mimo')w.mimos++}
function claimM(id){const w=wkEnsure(),m=MPOOL.find(x=>x.id===id);if(!m||w.claimed.includes(id)||m.p(w)<m.g)return;w.claimed.push(id);burst(30);add(m.r)}
function missionsHTML(){const w=wkEnsure();return `<section class="card"><h3>Misiones de la semana</h3><span class="mu">Cambian cada lunes</span>${wkMissions().map(m=>{const v=Math.min(m.g,m.p(w)),done=w.claimed.includes(m.id),ok=v>=m.g;return `<div class="ms"><div class="row sp"><b>${esc(m.t)}</b><span class="mu">${v}/${m.g}</span></div><div class="bar"><i style="width:${v/m.g*100}%"></i></div>${done?`<p class="row" style="color:var(--color-success-text);font-weight:500">${ic('check',18)} Cobrada · +${m.r} corazones</p>`:ok?`<button class="btn" onclick="claimM('${m.id}')">Cobrar ${m.r} corazones</button>`:`<span class="mu">Recompensa: ${m.r} corazones</span>`}</div>`}).join('')}</section>`}

/* ---------- home ---------- */
function home(){
 const lvl=Math.floor(S.xp/100),n=S.posts.length;
 const wq=S.group?'Cuéntale a '+fm()+' cómo lo viviste.':'Respóndela para tu diario.';
 return `
 ${heroHTML()}
 ${S.chest===today()?`<section class="card c"><span class="mu">Cofre de hoy abierto. Vuelve mañana por otro 🎁</span></section>`:`<section class="card c hero"><div class="chest">🎁</div><h3>¡${esc(S.pet.name)} te trajo un regalo!</h3><button class="btn" onclick="chest()">Abrir cofre</button></section>`}
 <section class="card"><div class="row sp"><h3 class="row" style="gap:6px;color:var(--pd)"><span class="${S.streak?'flick':''}" style="display:inline-flex">${ic('flame',20)}</span><span style="color:var(--tx)">${S.streak?'Racha de '+S.streak+(S.streak>1?' días':' día'):'Empieza tu racha hoy'}</span></h3><span class="mu">${S.posted?'Hoy ya cuentas':'Cuenta algo hoy'}</span></div><div class="days">${strip()}</div></section>
 <section class="card"><span class="mu">Pregunta de la semana</span><h2>${esc(wqNow())}</h2><p class="mu">${wq}</p><button class="btn" onclick="chooser(wqNow())">Responder</button></section>
 <section class="card"><h3>¿Cómo quieres contar hoy?</h3><div class="qp">${Object.entries(TY).map(([k,v])=>`<button onclick="compose('${k}')">${ic(v.i,18)}${v.l}</button>`).join('')}</div></section>
 ${missionsHTML()}${closetHTML()}
 ${moodCard()}<section class="card"><h3>${libName()}</h3><div class="bar"><i style="width:${Math.min(100,n/12*100)}%"></i></div><p class="mu">${Math.min(n,12)} de 12 historias. Con 12 se arma el libro.</p></section>`}
function chest(){const r=(10+Math.floor(Math.random()*21));S.chest=today();burst(32);add(r)}
const H=3600e3;
const QS=[
 {k:'dia',mood:1,t:()=>'¿Cómo te fue hoy, '+S.me.name+'?',o:[['😄 Genial','¡Qué alegría! Cuéntale tu día a alguien que quieres 💗',4],['🙂 Bien','Me alegra. Los días tranquilos también cuentan ✨',3],['😕 Regular','Te entiendo. Mañana es otra oportunidad y yo estoy contigo 🫶',2],['😢 Mal','Ven, te doy un abrazo gigante 🤗 Cuando quieras, me cuentas qué pasó.',1]]},
 {k:'fam',t:()=>'¿Hablaste hoy con alguien que quieres?',o:[['Sí','¡Qué bonito! Eso es lo que más cuenta 💗'],['Todavía no','Escríbele un mensajito ahora, seguro le alegra el día 📱']]},
 {k:'mejor',t:()=>'¿Qué fue lo mejor de tu día?',o:[['La comida','¡Ñam! Guárdame un poquito 🍪'],['Mi gente','Eso vale oro 💗 ¿Lo cuentas en una historia?'],['Trabajo o estudio','¡Qué orgullo! Sigue así 💪'],['Otra cosa','Cuéntamelo en una historia, quiero saberlo todo ✨']]},
 {k:'agua',t:()=>'¿Ya tomaste agua hoy?',o:[['Sí 💧','¡Muy bien! Los dos nos hidratamos ☁️'],['Ahorita','Anda, que yo te espero 🥤']]},
 {k:'hist',t:()=>'¿Me cuentas una historia hoy?',o:[['Sí, vamos','¡Sí! Elige cómo quieres contarla 🎉',0,'chooser'],['Luego','Dale, aquí estaré 💗']]},
 {k:'inv',cond:()=>S.group&&Object.keys(S.members).length<2,t:()=>'¿Ya invitaste a alguien a tu grupo?',o:[['Sí','¡Genial! Con ellos todo es más lindo 💗'],['Aún no','Comparte el código desde Familia, ¡quiero conocerlos!',0,'fam']]}
];
const asleep=()=>new Date().getHours()<6;
const fmtWait=ms=>{const m=Math.ceil(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
function ptTick(){const p=S.pt,now=Date.now(),m=Math.max(0,(now-p.t)/60000);p.love=Math.max(0,p.love-m/9);p.food=Math.max(0,p.food-m/7);p.t=now}
function greet(away){if(asleep())return{t:'Zzz… (tócame para despertarme)',o:null,q:null};const h=new Date().getHours(),g=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
 let t=g+', '+S.me.name+' 💗';if(away>6)t='¡Te extrañé! Pasaron '+Math.floor(away)+' horas. '+t;if(S.pt.food<30)t+=' Tengo hambre 🍪';return{t,o:null,q:null}}
const bubHTML=()=>`<div class="bub">${esc(S.bub.t)}</div>${S.bub.o?`<div class="qr">${S.bub.o.map((o,i)=>`<button onclick="reply(${i})">${esc(o[0])}</button>`).join('')}</div>`:''}`;
const statsHTML=()=>{const p=S.pt,st=(n,v,c)=>`<div class="st"><span>${n}</span><div class="bar sm ${c?'low':''}"><i style="width:${Math.round(v)}%"></i></div></div>`;
 return st('Ánimo',p.love,p.love<30)+st('Panza',p.food,p.food<30)+st('Nivel',S.xp%100)};
function petUI(){const b=$('#bubw');if(b)b.innerHTML=bubHTML();const x=$('#stw');if(x)x.innerHTML=statsHTML()}
function bubSay(t,o,q){S.bub={t,o:o||null,q:q||null};S.bubT=Date.now();petUI()}
function heroHTML(){const away=(Date.now()-S.pt.t)/H;ptTick();if(!S.bub)S.bub=greet(away);
 const lvl=Math.floor(S.xp/100),sz=Math.round(110+Math.min(S.xp,600)*.16),sl=asleep();
 return `<section class="card hero">
  <div class="fl ${sl?'sleep':''}" onclick="petTap()" onkeydown="if(event.key==='Enter')petTap()" role="button" tabindex="0" aria-label="Acariciar a ${esc(S.pet.name)}">${pet(S.pet.kind,sz,S.wear)}${sl?'<span class="zz">Zzz</span>':''}</div>
  <h2>${esc(S.pet.name)}</h2>
  <div class="mu">${STAGE[Math.min(lvl,3)]} · nivel ${lvl+1} · crece con tus corazones</div>
  <div id="bubw" class="bw" aria-live="polite">${bubHTML()}</div>
  <div class="stw" id="stw">${statsHTML()}</div>
  <div class="acts"><button class="btn s" onclick="petTap()">${ic('heart',18)}Mimar</button><button class="btn s" onclick="feed()">${ic('cup',18)}Comer</button><button class="btn s" onclick="chat()">${ic('star',18)}Charlar</button></div>
  <div class="mu">Faltan ${100-S.xp%100} corazones para que ${esc(S.pet.name)} crezca</div></section>`}
function petTap(){ptTick();const p=S.pt,now=Date.now(),wait=3*H-(now-p.lr);p.love=Math.min(100,p.love+12);burst(8,['💗','✨']);
 if(asleep()){bubSay('🥱 ¡Me despertaste! Pero con mimos te perdono.');hopPet();return}
 if(wait<=0){p.lr=now;S.bub={t:['¡Qué rico mimo! 💗','Me encantas, '+S.me.name+' 💕','¡Soy la mascota más feliz! ☁️'][Math.floor(Math.random()*3)],o:null,q:null};S.bubT=now;track('mimo');add(5)}
 else{bubSay('Mmm, qué rico 🥹 Mi próximo premio de mimos llega en '+fmtWait(wait));hopPet()}}
function feed(){ptTick();const p=S.pt,now=Date.now();if(p.food>=92){bubSay('Estoy llenita 🥹 Gracias, más tarde me da hambre.');return}
 p.food=Math.min(100,p.food+40);burst(8,['🍪','💗']);
 if(now-p.lf>4*H){p.lf=now;S.bub={t:'¡Ñam ñam! Estaba riquísimo 🍪',o:null,q:null};S.bubT=now;add(8)}else{bubSay('¡Ñam ñam! Gracias 🍪');hopPet()}}
function chat(){const now=Date.now(),el=QS.filter(q=>!q.cond||q.cond());let c=el.filter(q=>now-(S.pt.asked[q.k]||0)>6*H);if(!c.length)c=el;const q=c[Math.floor(Math.random()*c.length)];S.pt.asked[q.k]=now;bubSay(q.t(),q.o,q)}
function reply(i){const q=S.bub&&S.bub.q;if(!q)return;const o=q.o[i],p=S.pt,d=today();if(p.ad!==d){p.ad=d;p.ans=0}
 if(q.mood&&o[2])p.moods=(p.moods||[]).filter(m=>m.d!==d).concat({d,v:o[2]}).slice(-14);
 S.bub={t:o[1],o:null,q:null};S.bubT=Date.now();
 if(o[3]==='chooser')setTimeout(()=>chooser(),900);if(o[3]==='fam')setTimeout(()=>go('fam'),1100);
 if(p.ans<5){p.ans++;add(2)}else render()}
function petIdle(force){if(S.scr!=='main'||S.tab!=='home'||document.hidden||$('#sh.open')||$('.lvup'))return;ptTick();const now=Date.now();
 if(S.bub&&S.bub.q)return;if(!force&&now-(S.bubT||0)<14000)return;
 if(asleep()){if(!S.bub||!/Zzz/.test(S.bub.t))bubSay('Zzz… estoy soñando con tus historias 💤');return}
 const p=S.pt;if(p.food<35&&Math.random()<.7){bubSay('Tengo hambre… ¿me das de comer? 🍪');return}
 if(p.love<35&&Math.random()<.7){bubSay('Me siento solita… ¿me das un mimo? 💗');return}
 if(force||Math.random()<.65)chat();else bubSay(['¿Sabías que cada historia me hace crecer? 🌱','Me gusta cuando cuentas cosas de tu infancia','Hoy es buen día para una historia ✨'][Math.floor(Math.random()*3)])}
function moodCard(){const m=S.pt.moods||[];if(!m.length)return'';const E=['','😢','😕','🙂','😄'],L='DLMXJVS';
 return `<section class="card"><h3>Tu ánimo esta semana</h3><div class="days">${Array.from({length:7},(_,i)=>{const dt=new Date(Date.now()-(6-i)*864e5),e=m.find(x=>x.d===dt.toDateString());return `<span style="${e?'font-size:20px;background:var(--soft2)':''}">${e?E[e.v]:L[dt.getDay()]}</span>`}).join('')}</div><p class="mu">${esc(S.pet.name)} lo recuerda cada vez que le cuentas cómo te fue.</p></section>`}

/* solo se muestran fotos y audios guardados como datos; evita que otro miembro inyecte código */
const okSrc=s=>typeof s==='string'&&/^data:(image|audio)\/[a-z0-9.+-]+(;[a-z0-9=.+-]+)*;base64,[A-Za-z0-9+\/=]+$/i.test(s)?s:'';

 if(p.k==='foto')return `<img class="pimg" src="${sx}" alt="${esc(p.t)}">${x.cap?`<p>${esc(x.cap)}</p>`:''}`;
 if(p.k==='dibujo')return `<img class="pimg" src="${sx}" alt="Dibujo: ${esc(p.t)}">`;
 if(p.k==='carta')return `<div class="paperbox">${esc(x.tx||'')}</div>`;
 if(p.k==='receta')return `<div class="rcp">${x.by?`<span class="mu">Te la enseñó ${esc(x.by)}</span>`:''}<b>Ingredientes</b><ul>${(Array.isArray(x.ing)?x.ing:[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><b>Preparación</b><p>${esc(x.stp||'')}</p></div>`;
 return ''}

/* ---------- family ---------- */
/* QR sin librerías: modo bytes, corrección M, versiones 1 a 6 (hasta 106 caracteres). Devuelve un SVG. */
function qrSvg(text,px){
 const bytes=[...new TextEncoder().encode(text)];
 const ECC=[0,10,16,26,18,24,16],BLK=[0,1,1,1,2,2,4];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55}return r};
 let ver=0;for(let v=1;v<=6;v++){if(Math.floor(raw(v)/8)-ECC[v]*BLK[v]>=bytes.length+2){ver=v;break}}
 if(!ver)throw new Error('QR: texto muy largo');
 const size=ver*4+17,dataCw=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];
 // datos
 let bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
 put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
 put(0,Math.min(4,dataCw*8-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xEC;data.length<dataCw;p^=0xEC^0x11)data.push(p);
 // Reed-Solomon
 const EXP=new Array(512),LOG=new Array(256);for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 const gen=n=>{let g=[1];for(let i=0;i<n;i++){const h=new Array(g.length+1).fill(0);g.forEach((c,j)=>{h[j]^=c;h[j+1]^=mul(c,EXP[i])});g=h}return g};
 const rs=(d,n)=>{const g=gen(n),r=new Array(n).fill(0);d.forEach(b=>{const f=b^r.shift();r.push(0);for(let i=0;i<n;i++)r[i]^=mul(g[i+1],f)});return r};
 // bloques
 const nb=BLK[ver],short=nb-dataCw%nb,bl=Math.floor(dataCw/nb),blocks=[];let k=0;
 for(let i=0;i<nb;i++){const len=bl+(i<short?0:1);const d=data.slice(k,k+len);k+=len;blocks.push({d,e:rs(d,ECC[ver])})}
 const all=[];for(let i=0;i<bl+1;i++)blocks.forEach(b=>{if(i<b.d.length)all.push(b.d[i])});
 for(let i=0;i<ECC[ver];i++)blocks.forEach(b=>all.push(b.e[i]));
 // matriz
 const M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(0));F.push(new Array(size).fill(false))}
 const set=(x,y,v)=>{if(x>=0&&y>=0&&x<size&&y<size){M[y][x]=v?1:0;F[y][x]=true}};
 const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4)}};
 finder(3,3);finder(size-4,3);finder(3,size-4);
 for(let i=0;i<size;i++){if(!F[6][i])set(i,6,i%2===0);if(!F[i][6])set(6,i,i%2===0)}
 if(ver>=2){const n=Math.floor(ver/7)+2,st=Math.floor((ver*8+n*3+5)/(n*4-4))*2,pos=[6];for(let p=size-7;pos.length<n;p-=st)pos.splice(1,0,p);
  pos.forEach((x,i)=>pos.forEach((y,j)=>{if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
 // reservar formato
 const fmt=m=>{const d=(0<<3|m);let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);return((d<<10|r)^0x5412)};
 const drawFmt=m=>{const b=fmt(m),g=i=>(b>>>i)&1;
  for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
  for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,1)};
 drawFmt(0);
 // colocar datos
 const dm=[];let bi=0;
 for(let r=size-1;r>=1;r-=2){if(r===6)r=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=r-j,up=((r+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]){dm.push([x,y]);}}}
 const total=all.length*8;
 const build=m=>{const Q=M.map(r=>r.slice());dm.forEach(([x,y],i)=>{let b=i<total?(all[i>>>3]>>>(7-(i&7)))&1:0;const f=[(x+y)%2===0,y%2===0,x%3===0,(x+y)%3===0,(Math.floor(y/2)+Math.floor(x/3))%2===0,(x*y)%2+(x*y)%3===0,((x*y)%2+(x*y)%3)%2===0,((x+y)%2+(x*y)%3)%2===0][m];Q[y][x]=b^(f?1:0)});return Q};
 const fm=(Q,m)=>{const b=fmt(m),g=i=>(b>>>i)&1,s=(x,y,v)=>{Q[y][x]=v};
  for(let i=0;i<=5;i++)s(8,i,g(i));s(8,7,g(6));s(8,8,g(7));s(7,8,g(8));for(let i=9;i<15;i++)s(14-i,8,g(i));
  for(let i=0;i<8;i++)s(size-1-i,8,g(i));for(let i=8;i<15;i++)s(8,size-15+i,g(i));s(8,size-8,1)};
 const pen=Q=>{let p=0;for(let a=0;a<2;a++){for(let i=0;i<size;i++){let run=1;for(let j=1;j<size;j++){const c=a?Q[j][i]:Q[i][j],d=a?Q[j-1][i]:Q[i][j-1];if(c===d){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}}
  for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=Q[y][x];if(c===Q[y][x+1]&&c===Q[y+1][x]&&c===Q[y+1][x+1])p+=3}
  let dark=0;Q.forEach(r=>r.forEach(c=>dark+=c));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
 let best=null,bp=1e9;for(let m=0;m<8;m++){const Q=build(m);fm(Q,m);const p=pen(Q);if(p<bp){bp=p;best=Q}}
 const q=4,n=size+q*2;let d='';best.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q},${y+q}h1v1h-1z`}));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${px||240}" height="${px||240}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la invitación"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

  video:`<label class="drop" for="vd-f"><span class="ti">${ic('video',24)}</span><b>Elegir o grabar un video</b><span class="mu">Hasta 60 segundos</span></label><input id="vd-f" type="file" accept="video/*" hidden onchange="pick(this,'vid')"><video id="pv" class="pv" controls playsinline hidden></video><p class="err" id="err"></p>${ttl('Ponle un nombre a tu video')}<label class="lb" for="cap">¿Qué cuenta el video?</label><textarea id="cap" class="in" rows="2" maxlength="300"></textarea>${go}`,

 };

function chk(){const g=$('#go');if(!g)return;const v=id=>{const e=$('#'+id);return e?e.value.trim():''};let ok=false;
 switch(C.k){case 'foto':ok=!!C.url;break;case 'video':ok=!!C.url&&C.ok;break;case 'dibujo':ok=C.drawn;break;case 'carta':ok=v('tx').length>=10;break;case 'receta':ok=!!(v('ttl')&&v('ing')&&v('stp'));break}
 g.disabled=!ok}
function pick(i,t){const f=i.files&&i.files[0];if(!f)return;C.url=URL.createObjectURL(f);LIVE.add(C.url);const e=$('#pv');e.hidden=false;e.src=C.url;
 if(t==='vid'){C.ok=false;$('#err').textContent='';e.onloadedmetadata=()=>{C.ok=e.duration<=61;$('#err').textContent=C.ok?'':'El video dura más de 60 segundos. Elige uno más corto.';chk()};e.onerror=()=>{C.ok=false;$('#err').textContent='No se pudo abrir ese video. Prueba con otro archivo.';chk()}}
 else{C.ok=true;shrink(f)}chk()}
function shrink(f){const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);C.url=c.toDataURL('image/jpeg',.7);const e=$('#pv');if(e)e.src=C.url};im.src=URL.createObjectURL(f)}

/* voz real: MediaRecorder comprimido (24 kbps), se guarda dentro de la nota */
const MIMES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'],MAXV=120;
const micMime=()=>(window.MediaRecorder&&MediaRecorder.isTypeSupported)?(MIMES.find(m=>MediaRecorder.isTypeSupported(m))||''):'';
function voz(){
 if(C.ph===2)return `<div class="clip"><audio id="ap" controls preload="metadata" style="width:100%"></audio><span class="mu">Duración ${fmt(C.sec)}</span></div>
  <label class="lb" for="ttl">Título (opcional)</label><input id="ttl" class="in" maxlength="60" placeholder="Ponle un nombre a tu nota">
  <div class="row" style="gap:8px"><button class="btn s" onclick="redo()">Grabar otra vez</button><button class="btn" style="flex:1" id="go" onclick="doPub('voz')">Publicar en la familia</button></div>`;
 return `${C.err?`<p class="err" style="display:block">${esc(C.err)}</p>`:`<p class="mu">${C.ph?'Grabando. Toca para terminar.':'Toca el micrófono y cuéntalo a tu manera. Hasta 2 minutos.'}</p>`}<div class="wv ${C.ph?'go':''}">${bars(16,true)}</div><div id="tm" class="tm">${fmt(C.sec)}</div><div class="c"><button class="mic ${C.ph?'rc':''}" onclick="tg()" aria-label="${C.ph?'Detener':'Grabar'}">${ic(C.ph?'stop':'mic',34)}</button></div>`}
const vshow=()=>{const vb=$('#vb');if(!vb)return;vb.innerHTML=voz();const a=$('#ap');if(a&&C.audio)a.src=C.audio};
function stopRec(){if(C.rec&&C.rec.state!=='inactive'){try{C.rec.stop()}catch(e){}}}
async function tg(){
 if(C.ph===1){stopRec();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){C.err='Este navegador no permite grabar audio. Prueba con Chrome.';vshow();return}
 try{C.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
 catch(e){C.err=e&&e.name==='NotAllowedError'?'No tenemos permiso para usar el micrófono. Actívalo en los permisos del sitio y vuelve a intentar.':'No encontramos un micrófono disponible.';vshow();return}
 const mime=micMime(),ch=[];
 try{C.rec=new MediaRecorder(C.stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:24000})}catch(e){C.rec=new MediaRecorder(C.stream)}
 C.mime=C.rec.mimeType||mime||'audio/webm';C.discard=false;C.err='';
 C.rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
 C.rec.onstop=()=>{clearInterval(C.tm);if(C.stream)C.stream.getTracks().forEach(t=>t.stop());if(C.discard)return;
  const fr=new FileReader();fr.onload=()=>{C.audio=fr.result;C.ph=2;vshow()};fr.readAsDataURL(new Blob(ch,{type:C.mime}))};
 C.ph=1;C.sec=0;vshow();C.rec.start(1000);
 C.tm=setInterval(()=>{C.sec++;const e=$('#tm');if(e)e.textContent=fmt(C.sec);if(C.sec>=MAXV)stopRec()},1000)}
function redo(){C.ph=0;C.sec=0;C.audio=null;C.err='';vshow()}

/* drawing */
function initDraw(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineCap='round';x.lineJoin='round';
 let d=false,l=null;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;l=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.fillStyle=C.col;x.beginPath();x.arc(l[0],l[1],C.sz/2,0,7);x.fill();mark()};
 c.onpointermove=e=>{if(!d)return;const p=pt(e);x.strokeStyle=C.col;x.lineWidth=C.sz;x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();l=p};
 c.onpointerup=c.onpointercancel=()=>{d=false};
 function mark(){if(!C.drawn){C.drawn=true;chk()}}
}
function setCol(b){C.col=b.dataset.c;document.querySelectorAll('.swb').forEach(e=>e.classList.toggle('on',e===b))}

function clr(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);C.drawn=false;chk()}

function doPub(k){
 if(!window.CLOUD||!CLOUD.ready){toast('Sin conexión con tu cuenta. Intenta de nuevo en un momento.');return}
 const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
 const p={k,t:'',x:{}};
 if(k==='voz'){if(!C.audio){toast('Primero graba tu nota de voz.');return}p.t=g('ttl')||S.prompt||'Nota de voz';p.x={d:fmt(C.sec),src:C.audio,mime:C.mime}}
 if(k==='foto'){if(!C.url||C.url.startsWith('blob:')){toast('Un momento, preparando la foto…');return}p.t=g('ttl')||S.prompt||'Foto sin título';p.x={src:C.url,cap:g('cap')}}

 {const by=g('by2');if(by)p.by=by}
 if(JSON.stringify(p.x).length>850000){toast('Ese archivo pesa demasiado. Prueba con uno más liviano.');return}

 if(!S.posted){S.posted=true;S.streak++;S.best=Math.max(S.best||0,S.streak);S.last=today();setTimeout(()=>{toast('🔥 ¡Racha de '+S.streak+(S.streak>1?' días':' día')+'!');burst(26,['🔥','✨'])},1100)}

const DKEY='capsula_draft',DIDS={carta:['to','tx','by2'],receta:['ttl','by','ing','stp','by2'],foto:['ttl','cap','by2'],voz:['ttl','by2'],dibujo:['ttl','by2']};

 if(!d||d.k!==k||d.u!==S.user.uid||Date.now()-d.t>30*864e5)return;let n=0;Object.keys(d.f).forEach(id=>{const e=$('#'+id);if(e&&DIDS[k].includes(id)){e.value=String(d.f[id]).slice(0,e.maxLength>0?e.maxLength:5000);n++}});

const kName={voz:'Nota de voz',foto:'Foto',carta:'Carta',dibujo:'Dibujo',receta:'Receta'};
function memHtml(sp){const dt=ms=>new Date(ms).toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'});
 const one=p=>{const x=p.x||{};let b='';
  if(p.k==='foto')b=`<img src="${esc(x.src||'')}" alt="">${x.cap?`<p>${esc(x.cap)}</p>`:''}`;
  else if(p.k==='dibujo')b=`<img src="${esc(x.src||'')}" alt="">`;
  else if(p.k==='voz')b=`<audio controls src="${esc(x.src||'')}"></audio><p class="m">Duración ${esc(x.d||'')}</p>`;
  else if(p.k==='carta')b=`<p class="m">Para ${esc(x.to||'')}</p><p style="white-space:pre-wrap">${esc(x.tx||'')}</p>`;

  return `<article><h3>${esc(p.t||kName[p.k]||'')}</h3><p class="m">${kName[p.k]||''} · ${dt(p.ts)} · ${esc(p.by||p.an||'')}</p>${b}</article>`};
 return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis recuerdos de Cápsula</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:0 auto;padding:24px 16px;color:#1D1D1F;background:#F5F5F7}h1{font-size:28px}h2{margin-top:40px}article{background:#fff;border-radius:16px;padding:16px;margin:14px 0}img{max-width:100%;border-radius:12px}audio{width:100%}.m{color:#68686D;font-size:14px;margin:2px 0 8px}</style></head><body><h1>Mis recuerdos de Cápsula</h1><p class="m">Descargado el ${dt(Date.now())}</p>${sp.map(g=>`<h2>${esc(g.name)} (${g.posts.length})</h2>${g.posts.length?g.posts.map(one).join(''):'<p class="m">Todavía no hay historias aquí.</p>'}`).join('')}</body></html>`}
async function exportMem(){if(!window.CLOUD||!CLOUD.exportAll||!CLOUD.ready){toast('Espera un momento y vuelve a intentar');return}
 toast('Preparando tus recuerdos…');
 try{const sp=await CLOUD.exportAll();const n=sp.reduce((a,g)=>a+g.posts.length,0);
  const u=URL.createObjectURL(new Blob([memHtml(sp)],{type:'text/html'}));const a=document.createElement('a');a.href=u;a.download='recuerdos-capsula-'+new Date().toISOString().slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
  toast(n?'Listo: '+n+' historias descargadas':'Descargado, aún no tienes historias')}
 catch(e){toast('No se pudo preparar la descarga. Revisa tu conexión.')}}

/* ---------- puente con cloud.js ---------- */
const soft=()=>{if(S.scr==='main'){const a=document.activeElement;if(a&&a.id==='qat')return;render()}};
const boot=()=>`<div class="wl" style="justify-content:center;align-items:center;text-align:center"><div class="fl"><img class="bl" src="icons/icon-192.png" width="96" height="96" alt=""></div><h2>Cápsula</h2>${S.cloudErr?`<p class="err" style="display:block;max-width:300px">${esc(S.cloudErr)}</p><button class="btn" style="align-self:center" onclick="location.reload()">Reintentar</button>`:S.bootSlow?`<p class="mu">Tarda más de lo normal… revisa tu conexión.</p><button class="btn s" style="align-self:center" onclick="location.reload()">Reintentar</button>`:'<p class="mu">Cargando tu espacio…</p>'}</div>`;
window.APP={
 personal,legacy,
 localCache(uid){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&o.uid===uid?o:null}catch(e){return null}},
 legacyDone(){try{localStorage.removeItem(LEGACY)}catch(e){}},
 sync(st){SYNC=st;syncPaint()},
 /* Une la nube con la copia de este celular sin perder avances: lo que solo sube (corazones, mejor racha, historias) toma el mayor. */
 merge(c,l){if(!l||typeof l!=='object')return{data:c,changed:false};const d={...c};let ch=false;
  ['xp','best','total','qaN'].forEach(k=>{const a=+c[k]||0,b=+l[k]||0;if(b>a){d[k]=b;ch=true}});
  const un=(a,b)=>{const u=[...new Set([...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])])];return u};
  ['types','unl'].forEach(k=>{const u=un(c[k],l[k]);if(u.length>(Array.isArray(c[k])?c[k].length:0)){d[k]=u;ch=true}});
  const tc=Date.parse(c.last)||0,tl=Date.parse(l.last)||0;
  if(tl>tc){['last','streak','chest'].forEach(k=>{if(l[k]!==undefined)d[k]=l[k]});ch=true}
  else if(tl===tc&&(+l.streak||0)>(+c.streak||0)){d.streak=l.streak;ch=true}
  d.best=Math.max(+d.best||0,+d.streak||0);
  return{data:d,changed:ch}},
 noConfig(){S.cloudErr='Falta configurar Firebase: abre config.js y pega tus datos (mira el LEEME).';S.scr='welcome';render()},
 cloudError(m){S.cloudErr=m;render()},
 signedOut(){resetPersonal();S.user=null;S.cloudErr='';S.scr='welcome';cl();render()},
 applyUser(d,u){resetPersonal();S.user=u;S.me.name=String(d.name||u.name||'Amigo').slice(0,24);S.me.email=u.email;S.me.pic=u.photo;applyPersonal(d)},
 families(l){S.families=l},
 setGroup(g){S.group=g?{id:g.id,name:g.name,code:g.code,ownerUid:g.ownerUid,type:g.type||'familia'}:null},
 group(g){if(S.group&&S.group.id===g.id){Object.assign(S.group,{name:g.name,code:g.code,ownerUid:g.ownerUid,type:g.type||'familia'});S.families=S.families.map(f=>f.id===g.id?{...f,name:g.name}:f);soft()}},
 qa(st){const c=S.qa&&S.qa.day===st.day?S.qa:{day:st.day,mine:null,all:null};S.qa={...c,...st};if(S.tab==='triv')soft()},
 switched(){S.qa=null;S.posts=[];S.plim=60;S.members={};T={i:0,s:0,a:null};soft()},
 posts(l,lim){S.posts=l;S.plim=lim||60;soft()},
 members(m){S.members=m;soft()},
 afterLogin(){cl();S.cloudErr='';try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}const pc=S.joinCode;
  if(pc&&!S.families.some(f=>f.code===pc)){S.scr='group';S.gstep='join'}
  else{S.joinCode='';S.scr=S.petSet?'main':((S.group||S.solo||S.families.length)?'pet':'group');S.gstep='pick'}
  S.tab='home';render()}
};
render();setInterval(petIdle,20000);setTimeout(()=>petIdle(true),5000);
setTimeout(()=>{if(S.scr==='boot'&&!S.cloudErr){S.bootSlow=1;render()}},8000);
import('./cloud.js').catch(e=>{console.error(e);APP.cloudError('No pudimos conectar con el servicio. Revisa tu conexión e intenta de nuevo.')});
</script>
