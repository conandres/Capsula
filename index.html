/* Layout: one phone-width column. Intro cards + Google sign-in, group, pet, then 4 tabs with a center "Contar" button.
   Single light look by choice: warm ivory ground, sage actions, pink only as a brand accent. No dark mode. */
:root{
  /* Paleta cálida minimalista (DIRECCION_VISUAL_CAPSULA.md). Todos los colores de la interfaz salen de aquí. */
  --color-bg:#F6F3FF; --color-surface:#FFFFFF; --color-surface-soft:#EDE8FF; --color-paper:#FBF9FF;
  --color-text:#231B4A; --color-text-muted:#5B5481;      /* contraste >= 4.5:1 sobre el fondo */
  --color-border:#E3DCFA; --color-border-input:#C9BFF0;
  --color-primary:#6A4CD6; --color-primary-hover:#4F36B0; --color-on-primary:#FFFFFF;
  --color-accent-pink:#F27BB5; --color-accent-lilac:#8E7BE0; --color-accent-sand:#D9BD91; --color-sand-soft:#F6F0E4;
  --color-success:#2E9E6F; --color-success-bg:#E6F4EC; --color-success-text:#1E6B4A;
  --color-warning:#B78343;
  --color-danger:#B85F59; --color-danger-bg:#F5E2E0; --color-danger-text:#9A423B;
  --radius-card:22px; --shadow-soft:0 6px 18px rgba(0,0,0,.10); --overlay:rgba(0,0,0,.42);
  --tint:rgba(79,54,176,.06); --tint-2:rgba(79,54,176,.10); --line-soft:rgba(79,54,176,.06); --line-mid:rgba(79,54,176,.09);
  --nav-bg:rgba(255,255,255,.74); --top-bg:rgba(246,243,255,.85); --chip-bg:rgba(255,255,255,.8);
  --shadow-card:0 1px 2px rgba(79,54,176,.05),0 10px 30px rgba(79,54,176,.08); --shadow-hero:0 1px 2px rgba(79,54,176,.05),0 16px 40px rgba(79,54,176,.12); --shadow-pn:0 -10px 40px rgba(0,0,0,.12);
  /* Nombres anteriores: apuntan a los nuevos tokens para no tocar cada regla ni el JavaScript. */
  --bg:var(--color-bg); --card:var(--color-surface); --soft:var(--color-surface-soft); --soft2:var(--color-border); --line:var(--color-border);
  --tx:var(--color-text); --mu:var(--color-text-muted);
  --p:var(--color-primary); --p2:var(--color-primary); --pd:var(--color-primary);
  --ok:var(--color-success); --okbg:var(--color-success-bg); --bad:var(--color-danger); --badbg:var(--color-danger-bg);
  --f:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:light;
}
/* ---- Temas: azul es el predeterminado (:root). El elegido se guarda en la cuenta (users/{uid}.theme). ---- */
html[data-theme="rosa"]{
  --color-bg:#FFF6FA; --color-surface:#FFFFFF; --color-surface-soft:#FFEAF3; --color-paper:#FFFAFC;
  --color-text:#4A2336; --color-text-muted:#8A5A72; --color-border:#F7D6E6; --color-border-input:#E3B1CA;
  --color-primary:#B5336E; --color-primary-hover:#9A2A5E; --color-on-primary:#FFFFFF;
  --color-accent-pink:#E8709F; --color-sand-soft:#FFF0E0;
  --tint:rgba(181,51,110,.07); --tint-2:rgba(181,51,110,.12); --line-soft:rgba(181,51,110,.08); --line-mid:rgba(181,51,110,.14);
  --nav-bg:rgba(255,255,255,.76); --top-bg:rgba(255,246,250,.82); --chip-bg:rgba(255,255,255,.85);
  --shadow-card:0 1px 2px rgba(181,51,110,.05),0 10px 30px rgba(181,51,110,.07); --shadow-hero:0 1px 2px rgba(181,51,110,.05),0 16px 40px rgba(181,51,110,.10);
}
html[data-theme="negro"]{
  color-scheme:dark;
  --color-bg:#000000; --color-surface:#1C1C1E; --color-surface-soft:#2C2C2E; --color-paper:#242426;
  --color-text:#F5F5F7; --color-text-muted:#A1A1A6; --color-border:#2C2C2E; --color-border-input:#48484A;
  --color-primary:#F5F5F7; --color-primary-hover:#D8D8DC; --color-on-primary:#000000;
  --color-accent-pink:#E58FB0; --color-sand-soft:#2B261C;
  --color-success:#30D158; --color-success-bg:#12301F; --color-success-text:#7BE3A0;
  --color-danger:#FF6961; --color-danger-bg:#3A1C1A; --color-danger-text:#FF9C96;
  --overlay:rgba(0,0,0,.65); --shadow-soft:0 6px 18px rgba(0,0,0,.5);
  --tint:rgba(255,255,255,.07); --tint-2:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.08); --line-mid:rgba(255,255,255,.12);
  --nav-bg:rgba(28,28,30,.78); --top-bg:rgba(0,0,0,.8); --chip-bg:rgba(44,44,46,.85);
  --shadow-card:none; --shadow-hero:none; --shadow-pn:0 -10px 40px rgba(0,0,0,.6);
}

.bl{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 26px rgba(120,60,160,.28)}

.chip .ic{color:var(--color-accent-pink);fill:var(--color-accent-pink)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:8px}

.mg{display:grid;grid-template-columns:repeat(3,64px);gap:14px;justify-content:center}

 return `<div class="wl" style="justify-content:flex-start;overflow:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));"><h1 style="margin-top:18px">Antes de empezar</h1>
 <p class="mu">Cápsula es para personas de <b>13 años o más</b>. Cuéntanos lo básico para cuidarte mejor.</p>
 <label class="lb" for="lgn">¿Cómo te llamamos?</label><input id="lgn" class="in" maxlength="24" value="${esc(S.me.name)}" autocomplete="off">
 <label class="lb" id="lgbl">¿Cuándo naciste? <span class="mu">(solo guardamos mes y año)</span></label>
 <div style="display:flex;gap:8px" role="group" aria-labelledby="lgbl"><select id="lgm" class="in" aria-label="Mes" onchange="lgChk()"><option value="">Mes</option>${M.map((n,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${bm==String(i+1).padStart(2,'0')?'selected':''}>${n}</option>`).join('')}</select>
 <select id="lgy" class="in" aria-label="Año" onchange="lgChk()"><option value="">Año</option>${Array.from({length:90},(_,i)=>y-i).map(v=>`<option ${by==v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div id="lgg" style="display:none"><label class="chk"><input id="lggc" type="checkbox" onchange="lgChk()"> Soy menor de 18 años y mi mamá, papá o representante legal sabe que uso Cápsula y me autoriza.</label>
 <p class="mu">Es tu responsabilidad contar con esa autorización. Tu representante puede pedir que borremos tu cuenta cuando quiera.</p></div>
 <label class="chk" style="margin-top:12px"><input id="lgt" type="checkbox" onchange="lgChk()"> Leí y acepto los <a href="${LEGAL_URL}terminos.html" target="_blank" rel="noopener">Términos y condiciones</a> y la <a href="${LEGAL_URL}privacidad.html" target="_blank" rel="noopener">Política de privacidad y tratamiento de datos</a>.</label>
 <p class="err" id="lge" style="display:${S.lerr?'block':'none'}" role="alert">${esc(S.lerr||'')}</p>
 <button class="btn w" id="lgb" disabled onclick="lgGo()" style="margin-top:10px">Continuar</button>
 <button class="lnk" onclick="logout()">Salir</button></div>`}
function lgChk(){const m=$('#lgm').value,y=$('#lgy').value,a=y&&m?ageOf(y+'-'+m):null;
 $('#lgg').style.display=a!==null&&a>=13&&a<18?'block':'none';
 const ok=a!==null&&(a<13||($('#lgt').checked&&(a>=18||$('#lggc').checked)));$('#lgb').disabled=!ok}
async function lgGo(){const nm=$('#lgn').value.trim().slice(0,24),m=$('#lgm').value,y=$('#lgy').value;
 if(!nm){S.lerr='Escribe tu nombre.';render();return}
 const a=ageOf(y+'-'+m),err=t=>{S.lerr=t;const e=$('#lge');if(e){e.textContent=t;e.style.display='block'}};
 if(a===null)return;
 if(a<13){$('#lgb').disabled=true;S.u13=true;
  try{if(window.CLOUD&&CLOUD.deleteAccount)await CLOUD.deleteAccount(null)}catch(e){}
  try{localStorage.clear();localStorage.setItem('capsula_u13',String(Date.now()))}catch(e){}
  S.user=null;S.scr='under13';render();return}
 if(!$('#lgt').checked)return;
 const minor=a<18;if(minor&&!$('#lggc').checked)return;
 S.me.name=nm;S.birth=y+'-'+m;S.legal={v:LEGAL_V,t:Date.now(),minor:minor,guard:minor};S.lerr='';save();
 try{if(window.CLOUD){CLOUD.ping();const rf=localStorage.getItem('capsula_ref');if(rf){localStorage.removeItem('capsula_ref');CLOUD.refer(rf)}}}catch(e){}
 APP.goAfter()}
const under13=()=>`<div class="wl" style="justify-content:center;text-align:center;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));"><h1>Todavía no puedes usar Cápsula</h1><p class="mu">Cápsula es para personas de 13 años o más. No guardamos tus datos: tu cuenta quedó eliminada. ¡Te esperamos cuando cumplas 13!</p><button class="btn w" onclick="location.reload()">Entendido</button></div>`;

function groupScr(){
 const back=`<button class="bk" onclick="S.gstep='pick';render()">${ic('back',18)} Atrás</button>`;let b='';
 if(S.gstep==='pick')b=`${S.petSet?`<button class="bk" onclick="nextScr()">${ic('back',18)} Volver</button>`:''}<h1>Hola, ${esc(S.me.name)}. ¿Con quién compartes?</h1><p class="mu">Una cápsula es un espacio compartido (familia, pareja o amigos). Puedes tener varias y entrar a cada una desde Mis cápsulas.</p>
  <button class="opc" onclick="S.gstep='create';render()"><span class="ti">${ic('users',24)}</span><span class="tx"><b>Crear una cápsula</b><span class="mu">Familia, pareja o amigos. Tú invitas con un enlace o QR.</span></span></button>
  <button class="opc" onclick="S.gstep='join';render()"><span class="ti">${ic('heart',24)}</span><span class="tx"><b>Unirme a una cápsula</b><span class="mu">Si alguien ya creó una, usa su código.</span></span></button>
  ${S.petSet||S.families.length?'':`<button class="lnk" onclick="soloGo()">Empezar solo con Mi mundo</button>`}`;
 if(S.gstep==='create')b=`${back}<h1>Crea tu cápsula</h1><label class="lb" id="gtl">¿Con quién juegas?</label>
  <div class="gt" role="radiogroup" aria-labelledby="gtl">${Object.keys(GT).map(k=>`<button class="gtb ${S.gtype===k?'on':''}" role="radio" aria-checked="${S.gtype===k}" onclick="S.gname=$('#gname').value;S.gtype='${k}';render()"><b>${GT[k].n}</b><span class="mu">${GT[k].d}</span></button>`).join('')}</div>
  <label class="lb" for="gname">Nombre de la cápsula</label>
  <input id="gname" class="in" maxlength="30" placeholder="${GT[S.gtype].ph}" value="${esc(S.gname)}" onkeydown="if(event.key==='Enter')mk()">
  <p class="err" id="err"></p>
  <button class="btn w" id="mkb" onclick="mk()">Crear cápsula</button>`;
 if(S.gstep==='created')b=`<h1>¡Listo, ${esc(S.group.name)}!</h1><p class="mu">Comparte el enlace o el código con quien quieras que se una.</p>
  <div class="code">${esc(S.group.code)}</div>
  <button class="btn w" onclick="shareInvite()">Compartir invitación</button>
  <button class="btn s w" onclick="copyLink()">Copiar enlace</button>
  <button class="btn s w" onclick="showQr()">Mostrar código QR</button>
  <button class="btn s w" onclick="const id=S.group.id,fl=S.invFlow;S.invFlow=0;nextScr();openCap(id);if(fl){S.sub='personas';render()}">Continuar</button>`;
 if(S.gstep==='join')b=`${back}<h1>Únete a una cápsula</h1><label class="lb" for="gc">Código de la cápsula</label>
  <input id="gc" class="in" maxlength="8" placeholder="K7M2QX9P" value="${esc(S.joinCode)}" autocapitalize="characters" autocomplete="off" onkeydown="if(event.key==='Enter')jn()">
  <p class="err" id="err"></p>
  <button class="btn w" id="jnb" onclick="jn()">Unirme</button>`;
 return `<div class="ob">${b}</div>`}
async function mk(){const b=$('#mkb');if(!b||b.disabled)return;
 if(plusLive()&&!isPlus()&&S.families.length>=LIM.free.caps){plusOpen('caps');return}
 if(!navigator.onLine){gerr('Necesitas internet para crear el grupo.');return}
 b.disabled=true;b.textContent='Creando…';gerr('');
 try{await CLOUD.createFamily($('#gname').value.trim()||GT[S.gtype].dn,S.gtype);S.gname='';S.gstep='created';render()}
 catch(e){b.disabled=false;b.textContent='Crear grupo';gerr('No pudimos crear el grupo. Intenta de nuevo.')}}
async function jn(){const b=$('#jnb'),c=$('#gc').value.trim().toUpperCase();if(!b||b.disabled)return;
 if(plusLive()&&!isPlus()&&S.families.length>=LIM.free.caps&&!S.families.some(f=>f.code===c)){plusOpen('caps');return}
 if(c.length<4){gerr('Escribe el código completo.');return}
 if(!navigator.onLine){gerr('Necesitas internet para unirte.');return}
 b.disabled=true;b.textContent='Entrando…';gerr('');
 try{const r=await CLOUD.joinFamily(c);
  if(r.err){b.disabled=false;b.textContent='Unirme';if(r.err==='members'){plusOpen('members');return}gerr(r.err==='full'?'Ese grupo es de pareja y ya tiene a sus dos personas.':'No encontramos ese código. Revisa que esté bien escrito.');return}
  S.joinCode='';nextScr();toast('Ya eres parte de '+S.group.name+' 💗')}
 catch(e){b.disabled=false;b.textContent='Unirme';gerr('No pudimos unirte. Revisa tu conexión e intenta de nuevo.')}}
function soloGo(){S.solo=true;S.group=null;if(window.CLOUD&&CLOUD.ready)CLOUD.switchFamily(null);nextScr()}
function nextScr(){S.scr=S.petSet?'main':'pet';S.tab='home';render()}

function petScr(){return `<div class="ob"><h1>Elige tu mascota</h1><p class="mu">Crecerá con cada historia que cuentes.</p>
 <div class="pg">${Object.entries(PETS).map(([k,v])=>`<button class="pk ${S.pet.kind===k?'sel':''}" onclick="selPet('${k}')" aria-pressed="${S.pet.kind===k}">${pet(k,78)}<b>${v.d}</b></button>`).join('')}</div>
 <label class="lb" for="pn">¿Cómo se llama?</label>
 <input id="pn" class="in" maxlength="14" value="${esc(S.pet.name)}" oninput="S.pet.name=this.value;S.pe=1">
 <button class="btn w" onclick="startGame()">Empezar</button></div>`}
function selPet(k){S.pet.kind=k;if(!S.pe)S.pet.name=PETS[k].n;render()}
function startGame(){S.pet.name=S.pet.name.trim()||PETS[S.pet.kind].n;S.petSet=true;S.scr='main';S.tab='home';render();if((S.total||0)>0||S.posts.length){toast('¡'+S.pet.name+' ya está contigo!');return}petHello()}
function petHello(){const n=esc(S.pet.name);showSheet(`<div class="bz"><div style="display:flex;justify-content:center;margin-bottom:6px">${pet(S.pet.kind,120,[],0)}</div><h2>¡Hola, soy ${n}!</h2><p class="mu">Voy a crecer con cada historia que cuentes. Para empezar, cuéntame algo: una foto, una carta, un dibujo o tu voz.</p><p class="mu">Todo es privado. Solo lo ven las personas que tú invites.</p></div><button class="btn w" onclick="cl();dest()">Contar mi primera historia</button><button class="btn s w" onclick="cl();toast('Tus primeros pasos están en Inicio')">Mirar la app primero</button>`);psFill()}

/* ---------- main shell ---------- */
const spaceId=()=>S.group?S.group.id:null;
function spaceTo(id){id=id||null;if(spaceId()===id)return;if(window.CLOUD&&CLOUD.ready&&CLOUD.switchFamily)CLOUD.switchFamily(id);else S.group=id?(S.families.find(f=>f.id===id)||null):null}
const NK=()=>({home:'home',mundo:'mundo',caps:'caps',cap:'caps',act:'perfil',tienda:'tienda',perfil:'perfil'})[S.tab]||(S.group?'caps':'mundo');
const nMem=()=>Math.max(1,Object.keys(S.members).length);
const spaceTag=()=>S.group?`<span class="tag spc shr">${ic('users',14)}Compartido con ${nMem()} ${nMem()===1?'persona':'personas'}</span>`:`<span class="tag spc priv">${ic('lock',14)}Solo tú</span>`;
const hsub=()=>({home:'Hola, '+esc(S.me.name),mundo:'Mi mundo · solo tú',caps:'Mis cápsulas',cap:S.group?esc(S.group.name):'Mis cápsulas',act:'Actividad',perfil:'Perfil'})[S.tab]||(S.group?esc(S.group.name):'Mi mundo · solo tú');
const hdr=()=>`<div class="brand"><img class="bi" src="icons/icon-192.png" width="38" height="38" alt="" decoding="async"><span class="bn">Cápsula<small>${hsub()}</small></span></div><div class="row" style="gap:6px;flex:none"><button class="pf${syncOff()||SYNC.pend>0?' unsaved':''}" onclick="go('perfil')" aria-label="Mi perfil">${pfIn()}</button></div>`;
function shell(){return `<div class="top" id="hd">${hdr()}</div><main id="mn">${VIEW[S.tab]()}</main>
<nav aria-label="Principal">
 <button data-t="home" onclick="go('home')">${ic('home')}Inicio</button>
 <button data-t="mundo" onclick="go('mundo')">${ic('world')}Mi mundo</button>
 <button data-t="caps" onclick="go('caps')">${ic('caps')}Mis cápsulas</button>
 <button data-t="tienda" onclick="go('tienda')">${ic('bag')}Tienda</button>
 <button data-t="perfil" onclick="go('perfil')">${ic('user')}Perfil</button>
</nav>`}
function navSync(){document.querySelectorAll('nav [data-t]').forEach(b=>{const on=b.dataset.t===NK();b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')})}
function render(){
 checkUnl();save();
 if(S.scr==='main'&&$('#mn')){$('#mn').innerHTML=VIEW[S.tab]();$('#hd').innerHTML=hdr();navSync();p3mount();psFill();return}
 $('#scr').innerHTML=({boot,welcome,deleted,under13,legal:legalScr,group:groupScr,pet:petScr,main:shell})[S.scr]();
 if(S.scr==='welcome')bindCr();
 if(S.scr==='main'){navSync();enterAnim($('#mn'));p3mount()}
 psFill();
 const key=S.scr+':'+S.gstep;if(key!==render.k){render.k=key;if(S.scr==='group'||S.scr==='pet')enterAnim($('.ob'))}
}
function go(t){if(t==='mundo')spaceTo(null);S.tab=t;render();if(t==='mundo')guideAuto('mundo');if(t==='cap')guideAuto('cap');const mn=$('#mn');if(mn){mn.scrollTop=0;enterAnim(mn)}if(t==='mundo')setTimeout(()=>petIdle(true),4000)}
const openCap=id=>{spaceTo(id);S.sub='inicio';S.af='';go('cap')};
const goArc=()=>{spaceTo(null);S.af='';go('arc')};
const goTriv=()=>{spaceTo(null);go('triv')};
function enterAnim(m){if(!m)return;[...m.children].forEach((e,i)=>e.style.setProperty('--i',Math.min(i,8)));m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(m._h);m._h=setTimeout(()=>m.classList.remove('enter'),1400)}

/* ---------- semana: misiones y pregunta (cambian cada lunes) ---------- */
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wkKey=()=>{const d=weekStart();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const wkIdx=()=>Math.floor(weekStart().getTime()/(7*864e5));
const WQS=['¿Cuál fue tu peor trabajo?','¿Cuál es el mejor consejo que te han dado?','¿Qué comida te recuerda a tu infancia?','¿Cuál fue el regalo más especial que recibiste?','¿Qué travesura hiciste de niño que nadie sabía?','¿Cómo conociste a tu mejor amigo?','¿Cuál es tu recuerdo favorito de unas vacaciones en familia?','¿Qué canción te hace pensar en casa?','¿Qué te enseñó tu abuela o tu abuelo?','¿Cómo fue tu primer día de colegio o de trabajo?','¿Qué te daba más miedo de pequeño?','¿Qué tradición de tu familia no quieres que se pierda?','¿Qué tradición inventaste tú?','¿Cuál es el mejor consejo que le darías a un niño?','¿Qué cosa te gustaba de la escuela?','¿A quién admirabas de pequeño?','¿Qué oficio tuvo alguien de tu familia?','¿Cuál es el mejor lugar donde has dormido?','¿Qué cosa guardas de tu niñez?','¿Cuál es la mejor fiesta a la que has ido?','¿Qué te hacía reír de niño?','¿Qué comida preparaba tu abuela o abuelo?','¿Qué te dijeron tus padres que se te quedó grabado?','¿Cuál fue tu primera mascota?'];
const wqNow=()=>WQS[wkIdx()%WQS.length];
const MPOOL=[
 {id:'posts3',t:'Cuenta 3 historias esta semana',g:3,r:60,p:w=>w.posts},
 {id:'types3',t:'Cuenta de 3 formas distintas (voz, foto, carta…)',g:3,r:70,p:w=>w.types.length},
 {id:'trivia5',t:'Responde la pregunta del día 5 días esta semana',g:5,r:50,p:w=>w.trivia},
 {id:'mimos5',t:'Dale 5 mimos a tu mascota',g:5,r:40,p:w=>w.mimos},
 {id:'days4',t:'Cuenta algo en 4 días distintos',g:4,r:80,p:w=>w.days.length},
 {id:'voz1',t:'Graba una nota de voz',g:1,r:50,p:w=>w.types.includes('voz')?1:0},
 {id:'receta1',t:'Guarda una receta de la familia',g:1,r:60,p:w=>w.types.includes('receta')?1:0},
 {id:'foto2',t:'Sube 2 fotos',g:2,r:50,p:w=>w.fotos},
 {id:'carta1',t:'Escribe una carta a alguien',g:1,r:50,p:w=>w.types.includes('carta')?1:0},
 {id:'dibujo1',t:'Haz un dibujo',g:1,r:50,p:w=>w.types.includes('dibujo')?1:0},
 {id:'mimos10',t:'Dale 10 mimos a tu mascota',g:10,r:60,p:w=>w.mimos},
 {id:'exp1',t:'Manda a tu mascota de expedición',g:1,r:50,p:w=>w.exp||0},
 {id:'exp2',t:'Completa 2 expediciones',g:2,r:70,p:w=>w.exp||0},
 {id:'play3',t:'Juega al balón 3 veces',g:3,r:40,p:w=>w.play||0},
 {id:'play6',t:'Juega al balón 6 veces',g:6,r:60,p:w=>w.play||0},
 {id:'fotos3',t:'Sube 3 fotos',g:3,r:60,p:w=>w.fotos},
 {id:'days6',t:'Cuenta algo en 6 días distintos',g:6,r:90,p:w=>w.days.length}];
const wkEnsure=()=>{const k=wkKey();if(!S.wk||S.wk.k!==k)S.wk={k,posts:0,fotos:0,types:[],days:[],trivia:0,mimos:0,claimed:[]};return S.wk};
const wkMissions=()=>{const i=wkIdx()%MPOOL.length;return[0,3,6].map(j=>MPOOL[(i+j)%MPOOL.length])};
function track(t,k){const w=wkEnsure();
 if(t==='post'){w.posts++;if(k==='foto')w.fotos++;if(!w.types.includes(k))w.types.push(k);const d=today();if(!w.days.includes(d))w.days.push(d)}
 if(t==='trivia'||t==='qa')w.trivia++;if(t==='mimo')w.mimos++;if(t==='exp')w.exp=(w.exp||0)+1;if(t==='play')w.play=(w.play||0)+1}
function claimM(id){const w=wkEnsure(),m=MPOOL.find(x=>x.id===id);if(!m||w.claimed.includes(id)||m.p(w)<m.g)return;w.claimed.push(id);burst(30);rw(Math.round(m.r/4),Math.round(m.r/4),{free:true})}
function missionsHTML(){const w=wkEnsure();return `<section class="card"><h3>Misiones de la semana</h3><span class="mu">Cambian cada lunes</span>${wkMissions().map(m=>{const v=Math.min(m.g,m.p(w)),done=w.claimed.includes(m.id),ok=v>=m.g;return `<div class="ms"><div class="row sp"><b>${esc(m.t)}</b><span class="mu">${v}/${m.g}</span></div><div class="bar"><i style="width:${v/m.g*100}%"></i></div>${done?`<p class="row" style="color:var(--color-success-text);font-weight:500">${ic('check',18)} Cobrada · +${Math.round(m.r/4)} ${LI} Lumis y ${Math.round(m.r/4)} ${XI} XP</p>`:ok?`<button class="btn" onclick="claimM('${m.id}')">Cobrar ${Math.round(m.r/4)} Lumis y XP</button>`:`<span class="mu">Recompensa: ${Math.round(m.r/4)} ${LI} Lumis y ${Math.round(m.r/4)} ${XI} XP</span>`}</div>`}).join('')}</section>`}

/* ---------- home ---------- */
const VERB={voz:'grabó una nota de voz',foto:'compartió una foto',carta:'dejó una carta',dibujo:'hizo un dibujo',receta:'compartió una receta'};
function recentHTML(n){const L=S.posts.filter(p=>p.a!=='me'&&TY[p.k]&&!isBlk(p.a)).slice(0,n);
 return L.map(p=>`<button class="card row act" onclick="actGo('${esc(p.id)}')" style="flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%;border:0;font:inherit;color:inherit;cursor:pointer">${pAv(p.a,40)}<span class="tx" style="flex:1;min-width:0"><b>${esc(who(p.a,p))} ${VERB[p.k]||'compartió algo'}</b><span class="mu">${rel(p.ts)} · ${S.group?esc(S.group.name):'Mi mundo'}</span></span>${ic('back',18).replace('class="ic"','class="ic" style="transform:rotate(180deg);opacity:.5"')}</button>`).join('')}
function postOpen(id){const p=S.posts.find(x=>x.id===id);if(!p){toast('Ese recuerdo ya no está disponible.');return}
 showSheet(`<h2>${esc(p.t)}</h2><span class="mu">${esc(who(p.a,p))} · ${rel(p.ts)}</span>${postBody(p)}<button class="btn w" onclick="cl()">Cerrar</button>`)}
function actGo(id){const p=S.posts.find(x=>x.id===id);if(!p){toast('Ese recuerdo ya no está disponible.');return}
 if(S.group){const gid=S.group.id;spaceTo(gid);S.af='';S.sub=p.k==='carta'?'cartas':'recuerdos';go('cap')}
 setTimeout(()=>postOpen(id),180)}
function home(){
 const n=S.families.length,rc=recentHTML(3);
 return `${updCard()}<section class="card hw"><div style="max-width:200px"><span class="mu">Hola, ${esc(S.me.name)}</span><h2>Tu mundo te espera</h2><p class="mu" style="margin:4px 0 10px">Tu mascota ${esc(S.pet.name)} te espera. Cuídala y gana Lumis.</p><button class="btn" onclick="go('mundo')">Entrar</button></div><span class="hp"><span id="pet3dh" class="p3 p3h${P3.st==='fail'||P3.slow?' fb':''}"><span class="f2">${pet2d(S.pet.kind,104,S.wear,stg())}</span></span></span></section>
 ${fpCard()}
 <div class="duo"><button class="tile2" onclick="go('mundo')">${ic('world',26)}<b>Mi mundo</b><span class="mu">Solo tuyo: tu mascota y tu diario</span></button><button class="tile2" onclick="go('caps')">${ic('caps',26)}<b>Mis cápsulas</b><span class="mu">${n?'Compartes historias en '+n+(n>1?' espacios':' espacio'):'Comparte historias con tu familia o amigos'}</span></button></div>

function ballStart(e){e.preventDefault();const room=$('#room'),fl=room&&room.querySelector('.fl');if(!room)return;
 const el=document.createElement('div');el.className='dgf ball';el.textContent='⚽';document.body.appendChild(el);let x=e.clientX,y=e.clientY,pts=[[performance.now(),x,y]];
 const pos=()=>{el.style.transform=`translate(${x-30}px,${y-30}px)`};pos();
 const mv=ev=>{x=ev.clientX;y=ev.clientY;pos();const t=performance.now();pts.push([t,x,y]);while(pts.length>2&&t-pts[0][0]>120)pts.shift()};
 const end=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);
  const r=room.getBoundingClientRect();if(ev.type==='pointercancel'||x<r.left||x>r.right||y<r.top-30||y>r.bottom+30){el.remove();if(ev.type!=='pointercancel')toast('Suéltalo dentro del cuarto');return}
  const a=pts[0],b=pts[pts.length-1],dt=Math.max(16,b[0]-a[0]);let vx=(b[1]-a[1])/dt,vy=(b[2]-a[2])/dt;const sp=Math.hypot(vx,vy);if(sp>2.2){vx*=2.2/sp;vy*=2.2/sp}
  ballFly(el,room,fl,x,y,vx,vy)};

function ballFly(el,room,fl,x,y,vx,vy){const r=room.getBoundingClientRect(),floor=r.bottom-34,L=r.left+22,Rr=r.right-22,cx=(r.left+r.right)/2;let last=performance.now(),t0=last,rot=0,stop=0;el.classList.add('fly');
 if(fl)fl.style.transition='transform .35s ease-out';
 const step=now=>{const dt=Math.min(32,now-last);last=now;vy+=0.0022*dt;x+=vx*dt;y+=vy*dt;rot+=vx*dt*1.4;
  if(x<L){x=L;vx=Math.abs(vx)*.7}if(x>Rr){x=Rr;vx=-Math.abs(vx)*.7}
  if(y>floor){y=floor;vy=-Math.abs(vy)*.6;vx*=.82;if(Math.abs(vy)<.12)vy=0}
  if(y<r.top+10){y=r.top+10;vy=Math.abs(vy)*.5}

  if(fl)fl.style.transform=`translateX(${Math.max(-90,Math.min(90,(x-cx)*.8))}px)`;
  const settled=y>=floor-0.5&&Math.abs(vx)<.03&&vy===0;

 requestAnimationFrame(step)}

/* Cada ciclo recorre todo el banco en un orden distinto (sin repetir hasta agotarlo). Misma pregunta para todos los miembros de una cápsula el mismo día. */
function qPerm(L,c,salt){let s=(Math.imul(c+1,2654435761)^salt)>>>0;const ix=Array.from({length:L},(_,j)=>j);for(let j=L-1;j>0;j--){s=(Math.imul(s,1664525)+1013904223)>>>0;const k=s%(j+1);[ix[j],ix[k]]=[ix[k],ix[j]]}return ix}
function qPick(B,n,salt){const L=B.length,c=Math.floor(n/L),i=n%L,ix=qPerm(L,c,salt);if(c>0&&L>1){const pv=qPerm(L,c-1,salt);if(ix[0]===pv[L-1]){[ix[0],ix[1]]=[ix[1],ix[0]]}}return B[ix[i]]}

/* solo se muestran fotos y audios guardados como datos; evita que otro miembro inyecte código */
const okSrc=s=>typeof s==='string'&&/^data:(image|audio)\/[a-z0-9.+-]+(;[a-z0-9=.+-]+)*;base64,[A-Za-z0-9+\/=]+$/i.test(s)?s:'';
/* Las fotos y audios guardados como texto se convierten una sola vez en un enlace corto (blob) y se reutilizan: así cada repintado no vuelve a procesar megas de texto. */
const SRCM=new Map();
function fastSrc(s){if(typeof s!=='string'||s.length<64)return '';const k=s.length+':'+s.slice(20,60)+':'+s.slice(-40);let u=SRCM.get(k);if(u!==undefined)return u;
 u='';if(okSrc(s)){try{const c=s.indexOf(','),mt=s.slice(5,s.indexOf(';')),bin=atob(s.slice(c+1)),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);u=URL.createObjectURL(new Blob([a],{type:mt}))}catch(e){u=''}}
 SRCM.set(k,u);if(SRCM.size>120){const o=SRCM.keys().next().value,ou=SRCM.get(o);SRCM.delete(o);if(ou)try{URL.revokeObjectURL(ou)}catch(e){}}return u}

/* QR sin librerías: modo bytes, corrección M, versiones 1 a 6 (hasta 106 caracteres). Devuelve un SVG. */
function qrSvg(text,px){

 const ECC=[0,10,16,26,18,24,16],BLK=[0,1,1,1,2,2,4];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55}return r};
 let ver=0;for(let v=1;v<=6;v++){if(Math.floor(raw(v)/8)-ECC[v]*BLK[v]>=bytes.length+2){ver=v;break}}

 let bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
 put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
 put(0,Math.min(4,dataCw*8-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xEC;data.length<dataCw;p^=0xEC^0x11)data.push(p);
 // Reed-Solomon
 const EXP=new Array(512),LOG=new Array(256);for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 const gen=n=>{let g=[1];for(let i=0;i<n;i++){const h=new Array(g.length+1).fill(0);g.forEach((c,j)=>{h[j]^=c;h[j+1]^=mul(c,EXP[i])});g=h}return g};
 const rs=(d,n)=>{const g=gen(n),r=new Array(n).fill(0);d.forEach(b=>{const f=b^r.shift();r.push(0);for(let i=0;i<n;i++)r[i]^=mul(g[i+1],f)});return r};
 // bloques
 const nb=BLK[ver],short=nb-dataCw%nb,bl=Math.floor(dataCw/nb),blocks=[];let k=0;
 for(let i=0;i<nb;i++){const len=bl+(i<short?0:1);const d=data.slice(k,k+len);k+=len;blocks.push({d,e:rs(d,ECC[ver])})}
 const all=[];for(let i=0;i<bl+1;i++)blocks.forEach(b=>{if(i<b.d.length)all.push(b.d[i])});
 for(let i=0;i<ECC[ver];i++)blocks.forEach(b=>all.push(b.e[i]));
 // matriz
 const M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(0));F.push(new Array(size).fill(false))}
 const set=(x,y,v)=>{if(x>=0&&y>=0&&x<size&&y<size){M[y][x]=v?1:0;F[y][x]=true}};
 const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4)}};
 finder(3,3);finder(size-4,3);finder(3,size-4);
 for(let i=0;i<size;i++){if(!F[6][i])set(i,6,i%2===0);if(!F[i][6])set(6,i,i%2===0)}
 if(ver>=2){const n=Math.floor(ver/7)+2,st=Math.floor((ver*8+n*3+5)/(n*4-4))*2,pos=[6];for(let p=size-7;pos.length<n;p-=st)pos.splice(1,0,p);
  pos.forEach((x,i)=>pos.forEach((y,j)=>{if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
 // reservar formato
 const fmt=m=>{const d=(0<<3|m);let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);return((d<<10|r)^0x5412)};
 const drawFmt=m=>{const b=fmt(m),g=i=>(b>>>i)&1;
  for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
  for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,1)};
 drawFmt(0);
 // colocar datos
 const dm=[];let bi=0;
 for(let r=size-1;r>=1;r-=2){if(r===6)r=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=r-j,up=((r+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]){dm.push([x,y]);}}}
 const total=all.length*8;
 const build=m=>{const Q=M.map(r=>r.slice());dm.forEach(([x,y],i)=>{let b=i<total?(all[i>>>3]>>>(7-(i&7)))&1:0;const f=[(x+y)%2===0,y%2===0,x%3===0,(x+y)%3===0,(Math.floor(y/2)+Math.floor(x/3))%2===0,(x*y)%2+(x*y)%3===0,((x*y)%2+(x*y)%3)%2===0,((x+y)%2+(x*y)%3)%2===0][m];Q[y][x]=b^(f?1:0)});return Q};
 const fm=(Q,m)=>{const b=fmt(m),g=i=>(b>>>i)&1,s=(x,y,v)=>{Q[y][x]=v};
  for(let i=0;i<=5;i++)s(8,i,g(i));s(8,7,g(6));s(8,8,g(7));s(7,8,g(8));for(let i=9;i<15;i++)s(14-i,8,g(i));

 const pen=Q=>{let p=0;for(let a=0;a<2;a++){for(let i=0;i<size;i++){let run=1;for(let j=1;j<size;j++){const c=a?Q[j][i]:Q[i][j],d=a?Q[j-1][i]:Q[i][j-1];if(c===d){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}}
  for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=Q[y][x];if(c===Q[y][x+1]&&c===Q[y+1][x]&&c===Q[y+1][x+1])p+=3}

function showSheet(h){const s=$('#sh');s.innerHTML=`<div class="pn" role="dialog" aria-modal="true"><button class="x" onclick="cl()" aria-label="Cerrar">${ic('x',18)}</button>${h}</div>`;s.classList.add('open');try{psFill()}catch(e){}}
function cl(){clearInterval(C.tm);if(C.rec&&C.rec.state!=='inactive'){C.discard=true;try{C.rec.stop()}catch(e){}}if(C.stream)C.stream.getTracks().forEach(t=>t.stop());S.profileOpen=false;$('#sh').classList.remove('open')}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh'&&!$('.bz'))cl()});
const toDef=()=>S.group?({familia:'Toda la familia',pareja:'Mi pareja',amigos:'Mis amigos'})[gtype()]:'Mi yo del futuro';
function chooser(p){S.prompt=p||null;
 showSheet(`<h2>${p?'Responder la pregunta':'¿Cómo quieres contarlo?'}</h2><div class="dst">${spaceTag()}<span class="mu">${S.group?'en '+esc(S.group.name):'en Mi mundo'}</span></div>${p?`<p class="q">${esc(p)}</p>`:'<p class="mu">Elige la forma que más te guste.</p>'}
 <div class="tg">${Object.entries(TY).map(([k,v])=>`<button class="tile" onclick="compose('${k}')"><span class="ti">${ic(v.i,24)}</span><b>${v.l}</b><span class="mu">${v.h}</span></button>`).join('')}</div>`)}
function compose(k){
 if(k==='video'){showSheet(`<div class="ch"><span class="ti">${ic('video',22)}</span><h2>Videos muy pronto</h2></div><p class="mu">Estamos preparando el almacenamiento en la nube para los videos de tu familia. Mientras tanto, cuenta tu historia con foto, voz, carta, dibujo o receta.</p><button class="btn w" onclick="chooser()">Elegir otra forma</button>`);return}
 C={k,ph:0,sec:0,ok:false,drawn:false,url:null,col:'#ff8dbb',sz:8};
 const v=TY[k],pr=S.prompt?`<p class="q">${esc(S.prompt)}</p>`:'';
 const head=`<div class="ch"><span class="ti">${ic(v.i,22)}</span><h2>${v.l}</h2></div><div class="dst">${spaceTag()}<span class="mu">${S.group?'en '+esc(S.group.name):'en Mi mundo'}</span></div>${pr}<label class="lb" for="by2">¿Quién la cuenta? (opcional)</label><input id="by2" class="in" maxlength="30" placeholder="Yo, o por ejemplo: Abuela Rosa">`;
 const go=`<button class="btn w" id="go" onclick="doPub('${k}')" disabled>${S.group?'Publicar en '+esc(S.group.name):'Guardar en Mi mundo'}</button>`;
 const ttl=ph=>`<label class="lb" for="ttl">Título</label><input id="ttl" class="in" maxlength="60" placeholder="${ph}" oninput="chk()">`;
 const B={
  voz:`<div id="vb">${voz()}</div>`,
  foto:`<label class="drop" for="ph-f"><span class="ti">${ic('camera',24)}</span><b>Elegir una foto</b><span class="mu">De tu galería o de la cámara</span></label><input id="ph-f" type="file" accept="image/*" hidden onchange="pick(this,'img')"><img id="pv" class="pv" alt="Vista previa de tu foto" hidden>${ttl('Ponle un nombre al recuerdo')}<label class="lb" for="cap">¿Qué pasó ahí?</label><textarea id="cap" class="in tall" rows="6" maxlength="600" placeholder="Cuenta quiénes salen, dónde fue y qué recuerdas de ese día…" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,360)+'px'"></textarea>${go}`,
  carta:`<label class="lb" for="to">Para</label><input id="to" class="in" maxlength="40" placeholder="${toDef()}"><label class="lb" for="tx">Tu carta</label><textarea id="tx" class="in paper" rows="7" maxlength="800" placeholder="Querido(a)…" oninput="chk()"></textarea><p id="cth" class="mu" style="display:none">Escribe al menos 10 letras para poder guardarla.</p>${go}`,
  dibujo:`<canvas id="cv" class="cv" width="600" height="440" aria-label="Lienzo para dibujar"></canvas><div class="tools"><div class="row" style="gap:8px">${[['#ff8dbb','Rosa'],['#c43d7a','Fucsia'],['#ffb1d0','Rosa pastel'],['#7ccfae','Verde'],['#7fb8f5','Azul'],['#4a2336','Ciruela'],['#ffffff','Borrador']].map((c,i)=>`<button class="swb ${i?'':'on'}" style="background:${c[0]}" data-c="${c[0]}" onclick="setCol(this)" aria-label="${c[1]}"></button>`).join('')}</div><div class="row" style="gap:8px">${[4,8,16].map((s,i)=>`<button class="szb ${i===1?'on':''}" onclick="setSz(this,${s})" aria-label="Grosor ${s}"><i style="width:${s+2}px;height:${s+2}px"></i></button>`).join('')}<button class="btn s" onclick="clr()">Borrar todo</button></div></div>${ttl('Ponle un nombre a tu dibujo')}${go}`,
  video:`<label class="drop" for="vd-f"><span class="ti">${ic('video',24)}</span><b>Elegir o grabar un video</b><span class="mu">Hasta 60 segundos</span></label><input id="vd-f" type="file" accept="video/*" hidden onchange="pick(this,'vid')"><video id="pv" class="pv" controls playsinline hidden></video><p class="err" id="err"></p>${ttl('Ponle un nombre a tu video')}<label class="lb" for="cap">¿Qué cuenta el video?</label><textarea id="cap" class="in" rows="4" maxlength="600" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,360)+'px'"></textarea>${go}`,
  receta:`<label class="lb" for="ttl">Nombre del plato</label><input id="ttl" class="in" maxlength="60" placeholder="Sancocho del domingo" oninput="chk()"><label class="lb" for="by">¿Quién te la enseñó?</label><input id="by" class="in" maxlength="40" placeholder="Abuela Rosa"><label class="lb" for="ing">Ingredientes (uno por línea)</label><textarea id="ing" class="in" rows="4" maxlength="1500" oninput="chk()"></textarea><label class="lb" for="stp">Preparación</label><textarea id="stp" class="in" rows="4" maxlength="3000" oninput="chk()"></textarea>${go}`
 };
 showSheet(head+B[k]);if(k==='dibujo')initDraw();draftLoad(k);
}
function chk(){const g=$('#go');if(!g)return;const v=id=>{const e=$('#'+id);return e?e.value.trim():''};let ok=false;
 switch(C.k){case 'foto':ok=!!C.url;break;case 'video':ok=!!C.url&&C.ok;break;case 'dibujo':ok=C.drawn;break;case 'carta':ok=v('tx').length>=10;{const h=$('#cth');if(h)h.style.display=ok||!v('tx')?'none':'block'}break;case 'receta':ok=!!(v('ttl')&&v('ing')&&v('stp'));break}
 g.disabled=!ok}
function pick(i,t){const f=i.files&&i.files[0];if(!f)return;C.url=URL.createObjectURL(f);LIVE.add(C.url);const e=$('#pv');e.hidden=false;e.src=C.url;
 if(t==='vid'){C.ok=false;$('#err').textContent='';e.onloadedmetadata=()=>{C.ok=e.duration<=61;$('#err').textContent=C.ok?'':'El video dura más de 60 segundos. Elige uno más corto.';chk()};e.onerror=()=>{C.ok=false;$('#err').textContent='No se pudo abrir ese video. Prueba con otro archivo.';chk()}}
 else{C.ok=true;shrink(f)}chk()}
function shrink(f){const im=new Image();im.onload=()=>{/* Calidad alta: empieza grande y solo baja lo necesario para caber en el límite de la historia (880.000 caracteres). */
 let u='';const W=Math.max(im.width,im.height);for(const [m,q] of [[2000,.9],[1800,.86],[1600,.82],[1400,.78],[1200,.74],[1000,.7],[800,.66],[640,.6]]){const k=Math.min(1,m/W),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',q);if(u.length<=880000)break}
 C.url=u;const e=$('#pv');if(e)e.src=C.url;URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)}

/* voz real: MediaRecorder comprimido (24 kbps), se guarda dentro de la nota */
const MIMES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'],MAXV=120;
const micMime=()=>(window.MediaRecorder&&MediaRecorder.isTypeSupported)?(MIMES.find(m=>MediaRecorder.isTypeSupported(m))||''):'';
function voz(){
 if(C.ph===2)return `<div class="clip"><audio id="ap" controls preload="metadata" style="width:100%"></audio><span class="mu">Duración ${fmt(C.sec)}</span></div>
  <label class="lb" for="ttl">Título (opcional)</label><input id="ttl" class="in" maxlength="60" placeholder="Ponle un nombre a tu nota">
  <div class="row" style="gap:8px"><button class="btn s" onclick="redo()">Grabar otra vez</button><button class="btn" style="flex:1" id="go" onclick="doPub('voz')">Publicar en la familia</button></div>`;
 return `${C.err?`<p class="err" style="display:block">${esc(C.err)}</p>`:`<p class="mu">${C.ph?'Grabando. Toca para terminar.':'Toca el micrófono y cuéntalo a tu manera. Hasta 2 minutos.'}</p>`}<div class="wv ${C.ph?'go':''}">${bars(16,true)}</div><div id="tm" class="tm">${fmt(C.sec)}</div><div class="c"><button class="mic ${C.ph?'rc':''}" onclick="tg()" aria-label="${C.ph?'Detener':'Grabar'}">${ic(C.ph?'stop':'mic',34)}</button></div>`}
const vshow=()=>{const vb=$('#vb');if(!vb)return;vb.innerHTML=voz();const a=$('#ap');if(a&&C.audio)a.src=C.audio};
function stopRec(){if(C.rec&&C.rec.state!=='inactive'){try{C.rec.stop()}catch(e){}}}
async function tg(){
 if(C.ph===1){stopRec();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){C.err='Este navegador no permite grabar audio. Prueba con Chrome.';vshow();return}
 try{C.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
 catch(e){C.err=e&&e.name==='NotAllowedError'?'No tenemos permiso para usar el micrófono. Actívalo en los permisos del sitio y vuelve a intentar.':'No encontramos un micrófono disponible.';vshow();return}
 const mime=micMime(),ch=[];
 try{C.rec=new MediaRecorder(C.stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:24000})}catch(e){C.rec=new MediaRecorder(C.stream)}
 C.mime=C.rec.mimeType||mime||'audio/webm';C.discard=false;C.err='';
 C.rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
 C.rec.onstop=()=>{clearInterval(C.tm);if(C.stream)C.stream.getTracks().forEach(t=>t.stop());if(C.discard)return;
  const fr=new FileReader();fr.onload=()=>{C.audio=fr.result;C.ph=2;vshow()};fr.readAsDataURL(new Blob(ch,{type:C.mime}))};
 C.ph=1;C.sec=0;vshow();C.rec.start(1000);
 C.tm=setInterval(()=>{C.sec++;const e=$('#tm');if(e)e.textContent=fmt(C.sec);if(C.sec>=MAXV)stopRec()},1000)}
function redo(){C.ph=0;C.sec=0;C.audio=null;C.err='';vshow()}

/* drawing */
function initDraw(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineCap='round';x.lineJoin='round';
 let d=false,l=null;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;l=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.fillStyle=C.col;x.beginPath();x.arc(l[0],l[1],C.sz/2,0,7);x.fill();mark()};
 c.onpointermove=e=>{if(!d)return;const p=pt(e);x.strokeStyle=C.col;x.lineWidth=C.sz;x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();l=p};
 c.onpointerup=c.onpointercancel=()=>{d=false};
 function mark(){if(!C.drawn){C.drawn=true;chk()}}
}
function setCol(b){C.col=b.dataset.c;document.querySelectorAll('.swb').forEach(e=>e.classList.toggle('on',e===b))}
function setSz(b,s){C.sz=s;document.querySelectorAll('.szb').forEach(e=>e.classList.toggle('on',e===b))}
function clr(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);C.drawn=false;chk()}

function doPub(k,ok){
 if(!window.CLOUD||!CLOUD.ready){toast('Sin conexión con tu cuenta. Intenta de nuevo en un momento.');return}
 if(!ok&&S.group&&plusLive()&&MEDIA.includes(k)&&!famPlus()){CLOUD.mediaCount().then(n=>{if(n>=LIM.free.media)plusOpen('media');else doPub(k,1)}).catch(()=>doPub(k,1));return}
 const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
 const p={k,t:'',x:{}};
 if(k==='voz'){if(!C.audio){toast('Primero graba tu nota de voz.');return}p.t=g('ttl')||S.prompt||'Nota de voz';p.x={d:fmt(C.sec),src:C.audio,mime:C.mime}}
 if(k==='foto'){if(!C.url||C.url.startsWith('blob:')){toast('Un momento, preparando la foto…');return}p.t=g('ttl')||S.prompt||'Foto sin título';p.x={src:C.url,cap:g('cap')}}
 if(k==='dibujo'){p.t=g('ttl')||S.prompt||'Mi dibujo';p.x={src:$('#cv').toDataURL('image/png')}}
 if(k==='carta'){const to=g('to')||toDef();p.t='Carta para '+to;p.x={to,tx:g('tx')}}
 if(k==='receta'){p.t=g('ttl');p.x={by:g('by'),ing:g('ing').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,60),stp:g('stp')}}
 {const by=g('by2');if(by)p.by=by}
 if(JSON.stringify(p.x).length>850000){toast('Ese archivo pesa demasiado. Prueba con uno más liviano.');return}
 draftClear(k);
 CLOUD.publish(p).then(()=>{track('post',k);soft()}).catch(()=>toast('Tu historia no se guardó. Revisa tu conexión e inténtalo otra vez.'));
 S.types.add(k);S.total=(S.total||0)+1;
 if(!S.posted){S.posted=true;S.streak++;S.best=Math.max(S.best||0,S.streak);S.last=today();setTimeout(()=>{toast('🔥 ¡Racha de '+S.streak+(S.streak>1?' días':' día')+'!');burst(26,['🔥','✨'])},1100)}
 S.prompt=null;cl();if(S.group){S.tab='cap';S.sub='recuerdos'}else S.tab='arc';S.bub={t:say(PREACT[k]||PREACT.foto),o:null,q:null};S.bubT=Date.now();rw(TY[k].xp,TY[k].c);
}

/* ---------- estado de guardado ---------- */
let SYNC={pend:0};
const syncOff=()=>navigator.onLine===false;
const syncTxt=()=>syncOff()?'Sin conexión. Tus cambios están a salvo en este celular y se envían solos cuando vuelvas.':SYNC.pend>0?'Guardando en tu cuenta…':'Todo guardado en tu cuenta.';
function syncPaint(){const w=syncOff()||SYNC.pend>0;const b=$('.top .pf');if(b)b.classList.toggle('unsaved',w);const e=$('#sy');if(e){e.className='sy mu'+(w?' w':'');e.lastChild.textContent=syncTxt()}}
addEventListener('online',syncPaint);addEventListener('offline',syncPaint);

/* ---------- borradores: lo que escribes (texto) sobrevive aunque cierres la app ---------- */
const DKEY='capsula_draft',DIDS={carta:['to','tx','by2'],receta:['ttl','by','ing','stp','by2'],foto:['ttl','cap','by2'],voz:['ttl','by2'],dibujo:['ttl','by2']};
function draftSave(){if(!S.user||!C||!DIDS[C.k])return;clearTimeout(draftSave.h);draftSave.h=setTimeout(()=>{try{const f={};DIDS[C.k].forEach(id=>{const e=$('#'+id);if(e&&e.value.trim())f[id]=e.value});
 if(Object.keys(f).length)localStorage.setItem(DKEY,JSON.stringify({k:C.k,u:S.user.uid,t:Date.now(),f}));else draftClear(C.k)}catch(e){}},500)}
function draftClear(k){try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(!d||!k||d.k===k)localStorage.removeItem(DKEY)}catch(e){}}
function draftLoad(k){if(!S.user||!DIDS[k])return;try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');
 if(!d||d.k!==k||d.u!==S.user.uid||Date.now()-d.t>30*864e5)return;let n=0;Object.keys(d.f).forEach(id=>{const e=$('#'+id);if(e&&DIDS[k].includes(id)){e.value=String(d.f[id]).slice(0,e.maxLength>0?e.maxLength:5000);n++}});
 if(n){chk();toast('Recuperamos lo que estabas escribiendo')}}catch(e){}}
document.addEventListener('input',e=>{if(e.target&&e.target.closest&&e.target.closest('#sh'))draftSave()});

/* ---------- descargar mis recuerdos (un solo archivo que se abre en cualquier navegador) ---------- */
const kName={voz:'Nota de voz',foto:'Foto',carta:'Carta',dibujo:'Dibujo',receta:'Receta'};
function memHtml(sp){const dt=ms=>new Date(ms).toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'});
 const one=p=>{const x=p.x||{};let b='';
  if(p.k==='foto')b=`<img src="${esc(x.src||'')}" alt="">${x.cap?`<p>${esc(x.cap)}</p>`:''}`;
  else if(p.k==='dibujo')b=`<img src="${esc(x.src||'')}" alt="">`;
  else if(p.k==='voz')b=`<audio controls src="${esc(x.src||'')}"></audio><p class="m">Duración ${esc(x.d||'')}</p>`;
  else if(p.k==='carta')b=`<p class="m">Para ${esc(x.to||'')}</p><p style="white-space:pre-wrap">${esc(x.tx||'')}</p>`;
  else if(p.k==='receta')b=`${x.by?`<p class="m">Enseñada por ${esc(x.by)}</p>`:''}<h4>Ingredientes</h4><ul>${(x.ing||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h4>Preparación</h4><p style="white-space:pre-wrap">${esc(x.stp||'')}</p>`;
  return `<article><h3>${esc(p.t||kName[p.k]||'')}</h3><p class="m">${kName[p.k]||''} · ${dt(p.ts)} · ${esc(p.by||p.an||'')}</p>${b}</article>`};
 return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis recuerdos de Cápsula</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:0 auto;padding:24px 16px;color:#1D1D1F;background:#F5F5F7}h1{font-size:28px}h2{margin-top:40px}article{background:#fff;border-radius:16px;padding:16px;margin:14px 0}img{max-width:100%;border-radius:12px}audio{width:100%}.m{color:#68686D;font-size:14px;margin:2px 0 8px}</style></head><body><h1>Mis recuerdos de Cápsula</h1><p class="m">Descargado el ${dt(Date.now())}</p>${sp.map(g=>`<h2>${esc(g.name)} (${g.posts.length})</h2>${g.posts.length?g.posts.map(one).join(''):'<p class="m">Todavía no hay historias aquí.</p>'}`).join('')}</body></html>`}
async function exportMem(){if(!window.CLOUD||!CLOUD.exportAll||!CLOUD.ready){toast('Espera un momento y vuelve a intentar');return}
 toast('Preparando tus recuerdos…');
 try{const sp=await CLOUD.exportAll();const n=sp.reduce((a,g)=>a+g.posts.length,0);
  const u=URL.createObjectURL(new Blob([memHtml(sp)],{type:'text/html'}));const a=document.createElement('a');a.href=u;a.download='recuerdos-capsula-'+new Date().toISOString().slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
  toast(n?'Listo: '+n+' historias descargadas':'Descargado, aún no tienes historias')}
 catch(e){toast('No se pudo preparar la descarga. Revisa tu conexión.')}}

/* ---------- puente con cloud.js ---------- */
const soft=()=>{if(S.scr==='main'){const a=document.activeElement;if(a&&(a.id==='qat'||a.id==='pfn'||a.id==='pfm'))return;render()}};
const boot=()=>`<div class="wl" style="justify-content:center;align-items:center;text-align:center"><div class="fl"><img class="bl" src="icons/icon-192.png" width="96" height="96" alt=""></div><h2>Cápsula</h2>${S.cloudErr?`<p class="err" style="display:block;max-width:300px">${esc(S.cloudErr)}</p><button class="btn" style="align-self:center" onclick="location.reload()">Reintentar</button>`:S.bootSlow?`<p class="mu">Tarda más de lo normal… revisa tu conexión.</p><button class="btn s" style="align-self:center" onclick="location.reload()">Reintentar</button>`:'<p class="mu">Cargando tu espacio…</p>'}</div>`;
window.APP={
 fullName:()=>(S.me.name+' '+(S.me.ln||'')).trim().slice(0,40),nameP:v=>{if(v===false)S.nameP=0;return !!S.nameP},
 personal,legacy,
 localCache(uid){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&o.uid===uid?o:null}catch(e){return null}},
 legacyDone(){try{localStorage.removeItem(LEGACY)}catch(e){}},
 sync(st){SYNC=st;syncPaint()},
 /* Une la nube con la copia de este celular sin perder avances: lo que solo sube (corazones, mejor racha, historias) toma el mayor. */
 merge(c,l){if(!l||typeof l!=='object')return{data:c,changed:false};const d={...c};let ch=false;
  ['xp','best','total','qaN'].forEach(k=>{const a=+c[k]||0,b=+l[k]||0;if(b>a){d[k]=b;ch=true}});
  if((+l.lmT||0)>(+c.lmT||0)){d.lm=l.lm;d.lmT=l.lmT;d.cap=l.cap;ch=true}
  if(l.rm&&!c.rm){d.rm=l.rm;ch=true}
  const un=(a,b)=>{const u=[...new Set([...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])])];return u};
  ['types','unl'].forEach(k=>{const u=un(c[k],l[k]);if(u.length>(Array.isArray(c[k])?c[k].length:0)){d[k]=u;ch=true}});
  const tc=Date.parse(c.last)||0,tl=Date.parse(l.last)||0;
  if(tl>tc){['last','streak','chest'].forEach(k=>{if(l[k]!==undefined)d[k]=l[k]});ch=true}
  else if(tl===tc&&(+l.streak||0)>(+c.streak||0)){d.streak=l.streak;ch=true}
  d.best=Math.max(+d.best||0,+d.streak||0);
  return{data:d,changed:ch}},
