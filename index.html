<title>Cápsula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Intro cards + Google sign-in, group, pet, then 4 tabs with a center "Contar" button.
   Single light look by choice: white ground, pastel pink accents, plum text. No dark mode. */
:root{
  --bg:#ffffff; --card:#ffffff; --soft:#fff3f8; --soft2:#ffe0ee; --line:#ffd3e5;
  --tx:#4a2336; --mu:#8a5a72; --p:#ffb1d0; --p2:#ff8dbb; --pd:#c43d7a;
  --ok:#1f7a58; --okbg:#dff6ec; --bad:#b32a56; --badbg:#ffe3ea;
  --f:'Fredoka',ui-rounded,'Nunito','Varela Round',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{box-sizing:border-box;height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;display:flex;justify-content:center}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul{margin:0}
h1{font-size:25px;line-height:1.15;font-weight:600;text-wrap:balance}
h2{font-size:20px;font-weight:600;text-wrap:balance}
h3{font-size:16px;font-weight:600}
ul{padding-left:20px}
.mu{color:var(--mu);font-size:13px;line-height:1.35}
.c{text-align:center}
.ic{flex:none}
:focus-visible{outline:3px solid var(--pd);outline-offset:2px}

.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:460px){.app{border-inline:1px solid var(--soft2)}}
#scr{flex:1;min-height:0;display:flex;flex-direction:column}

/* top bar + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:600;font-size:21px;line-height:1.1;min-width:0}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 6px;font-weight:500;flex:none}
.chip .ic{color:var(--pd);fill:var(--p)}
main{flex:1;min-height:0;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
nav{display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 10px;gap:2px}
nav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;border-radius:16px;cursor:pointer;min-height:50px}
nav button.on{color:var(--pd);background:var(--soft)}
nav .pub{flex:0 0 70px;color:var(--tx);font-weight:500}
nav .pub .pb{width:56px;height:56px;border-radius:50%;background:var(--p);display:grid;place-items:center;margin-top:-28px;border:4px solid #fff;box-shadow:0 6px 16px rgba(255,141,187,.45)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.c{align-items:center}
.hero{background:var(--soft);border-color:var(--soft2);align-items:center;text-align:center}
.btn{border:0;background:var(--p);color:var(--tx);font-weight:600;font-size:16px;padding:12px 22px;border-radius:99px;cursor:pointer;min-height:46px;align-self:flex-start}
.btn:active{transform:scale(.97)}
.btn.s{background:var(--soft);color:var(--pd);border:1px solid var(--line)}
.btn.w{align-self:stretch}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:14px;background:var(--soft2);border-radius:99px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--p2);border-radius:99px;transition:width .5s}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.fl{display:inline-block;animation:fl 3s ease-in-out infinite;cursor:pointer}
@keyframes fl{50%{transform:translateY(-6px)}}
.days{display:flex;justify-content:space-between;gap:4px}
.days span{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--mu);display:grid;place-items:center;font-size:13px;flex:none}
.days .on{background:var(--p);color:var(--tx);font-weight:600}.days .now{outline:2px dashed var(--pd);outline-offset:2px}
.qp{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qp button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);color:var(--pd);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px}
.ti{width:44px;height:44px;border-radius:50%;background:var(--soft2);color:var(--pd);display:grid;place-items:center;flex:none}
.av{border-radius:50%;background:var(--soft2);display:grid;place-items:center;flex:none;font-weight:600;color:var(--tx);overflow:hidden}
.tx{display:flex;flex-direction:column;min-width:0;gap:1px}
.tx b{overflow-wrap:anywhere}
.tag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--pd);border-radius:99px;padding:3px 10px;font-size:12px;flex:none}

/* trivia */
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:13px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:16px;cursor:pointer;min-height:48px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#14573f}.opt.no{background:var(--badbg);border-color:var(--bad);color:#7a1130}
.quote{font-size:19px;font-weight:500;line-height:1.3}

/* archive */
.aud{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:10px 12px}
.pl{width:40px;height:40px;border-radius:50%;border:0;background:var(--p);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.wv{display:flex;gap:3px;height:44px;align-items:center;justify-content:center;flex:1;min-width:0}
.wv i{width:5px;border-radius:9px;background:var(--p)}
.wv.go i{animation:wv .8s infinite ease-in-out}@keyframes wv{50%{height:40px}}
.pimg{width:100%;border-radius:18px;display:block;background:var(--soft)}
.paperbox{background:#fffafc;border:1px solid var(--soft2);border-radius:16px;padding:12px 14px;white-space:pre-wrap;line-height:1.5}
.rcp{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rcp p{white-space:pre-wrap}
.rx{display:flex;gap:8px;flex-wrap:wrap}
.rx button{border:2px solid var(--soft2);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;min-height:36px}
.rx .on{background:var(--soft2);border-color:var(--p2)}

/* family */
.rk{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}.rk.g{background:var(--p)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd div{background:var(--soft);border-radius:20px;padding:12px 4px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--pd)}
.bd .lk{opacity:.4;filter:grayscale(1)}
.code{font-size:32px;font-weight:600;letter-spacing:.2em;text-align:center;background:var(--soft);border:2px dashed var(--p);border-radius:20px;padding:14px 8px 14px 16px;overflow-wrap:anywhere}

/* onboarding */
.wl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px 0 8px}
.wl .pad{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px}
.cr{flex:1;min-height:380px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.cr::-webkit-scrollbar{display:none}
.ct{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--soft),#fff 75%);border:1px solid var(--soft2);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ct::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(var(--soft2),transparent 70%);top:-70px;right:-60px;animation:drift2 7s ease-in-out infinite alternate;pointer-events:none}
.ct>*{position:relative}
.ct h2{font-size:25px;line-height:1.15}
.ct .mu{font-size:15px}
.ct .mu.k{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.ill{flex:1;min-height:220px;background:#fff;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(255,141,187,.14)}
.mg{display:grid;grid-template-columns:repeat(3,64px);gap:14px;justify-content:center}
.mg .ti{width:64px;height:64px;border-radius:22px}
.mq{font-size:15px;font-weight:500;text-align:center;line-height:1.3;text-wrap:balance}
.mo{border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-size:15px;width:100%;max-width:290px;text-align:center;background:#fff}
.wz{position:relative;height:118px;width:100%;overflow:hidden}
.wb{position:absolute;left:var(--x);bottom:var(--y);background:var(--soft2);border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--mu)}
.safe{display:flex;align-items:center;gap:10px;background:var(--okbg);color:var(--ok);border-radius:20px;padding:8px 16px 8px 8px;font-weight:600}
.safe .ti{background:#fff;color:var(--ok)}
.hz{position:relative;display:flex;justify-content:center;width:100%}
.hz .hh{position:absolute;bottom:30%;color:var(--p2);fill:var(--p2);opacity:0}
.pw{display:inline-flex}.row5{display:flex;gap:6px;justify-content:center}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:290px}
.sg i{aspect-ratio:1;border-radius:11px;background:var(--p);display:block}.sg i:nth-child(n+6){background:var(--soft2)}
.bk2{display:inline-flex;color:var(--pd)}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{border:0;padding:0;width:8px;height:8px;min-height:0;border-radius:9px;background:var(--soft2);position:relative;overflow:hidden;cursor:pointer;transition:width .3s}
.dots button.on{width:34px}
.dots button.on::after{content:'';position:absolute;inset:0;background:var(--pd);transform-origin:left;animation:dt 3s linear forwards}
.dots.hold button.on::after{animation-play-state:paused}
.cta{padding:10px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--soft2)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:12px;font-weight:600;font-size:16px;cursor:pointer;min-height:50px}
.ob{flex:1;min-height:0;overflow-y:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.opc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:22px;padding:14px;cursor:pointer;min-height:72px}
.opc:hover{background:var(--soft)}
.bk{align-self:flex-start;border:0;background:none;color:var(--pd);display:flex;gap:4px;align-items:center;cursor:pointer;font-weight:500;min-height:40px;padding:0}
.lnk{border:0;background:none;color:var(--pd);font-weight:600;text-decoration:underline;cursor:pointer;min-height:44px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{border:2px solid var(--line);background:#fff;border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.pk.sel{border-color:var(--pd);background:var(--soft)}

/* forms + sheet */
.in{width:100%;border:2px solid var(--line);border-radius:16px;padding:11px 14px;background:#fff;font-size:16px;min-width:0}
.in:focus{border-color:var(--pd);outline:none}
textarea.in{resize:vertical;line-height:1.4}
.paper{line-height:28px;background-image:repeating-linear-gradient(transparent,transparent 27px,var(--soft2) 27px,var(--soft2) 28px);background-color:#fffafc}
.lb{font-weight:500;font-size:13px;color:var(--mu);margin-bottom:-4px}
.err{color:var(--bad);font-size:13px}.err:empty{display:none}
.q{background:var(--soft);border-radius:16px;padding:10px 14px;font-weight:500}
.sh{position:absolute;inset:0;background:rgba(74,35,54,.38);display:none;align-items:flex-end;z-index:20}.sh.open{display:flex}
.pn{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));position:relative;display:flex;flex-direction:column;gap:10px}
.pn h2{padding-right:44px}
.x{position:absolute;right:12px;top:12px;border:0;background:var(--soft);color:var(--pd);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ch{display:flex;align-items:center;gap:10px;padding-right:44px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);background:#fff;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start;cursor:pointer;min-width:0}
.tile:hover{background:var(--soft)}
.drop{border:2px dashed var(--p);background:var(--soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.pv{width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:var(--soft)}
.cv{width:100%;aspect-ratio:600/440;border:2px solid var(--line);border-radius:18px;touch-action:none;background:#fff;display:block}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swb.on{outline:3px solid var(--pd);outline-offset:2px}
.szb{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.szb.on{border-color:var(--pd);background:var(--soft)}
.szb i{display:block;border-radius:50%;background:var(--tx)}
.clip{background:var(--soft);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tm{font-size:30px;font-weight:600;text-align:center}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--p);color:var(--tx);cursor:pointer;display:inline-grid;place-items:center}
.mic.rc{animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.1)}}
.ts{position:absolute;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-weight:500;transition:transform .35s;z-index:30;max-width:92%;text-align:center}
.ts.show{transform:translate(-50%,0)}
.cf{position:absolute;bottom:38%;font-size:22px;pointer-events:none;z-index:50;animation:cf 1.5s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fh{position:absolute;left:50%;top:32%;font-weight:600;font-size:28px;color:var(--pd);z-index:50;pointer-events:none;animation:fh 1.2s ease-out forwards}
@keyframes fh{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.fl.hop{animation:hop .6s ease-out}
@keyframes hop{0%{transform:none}25%{transform:translateY(-34px) scale(.92,1.1)}50%{transform:translateY(0) scale(1.15,.85)}70%{transform:translateY(-12px)}100%{transform:none}}
.lvup{position:absolute;inset:0;background:rgba(74,35,54,.55);z-index:40;display:grid;place-items:center;padding:20px;animation:fi .3s}
.lvc{background:#fff;border-radius:32px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;animation:pp .55s cubic-bezier(.2,1.6,.4,1)}
.lvp{animation:hop 1s .3s 2;filter:drop-shadow(0 0 18px #ffd54a)}
@keyframes fi{from{opacity:0}}@keyframes pp{from{transform:scale(.4);opacity:0}}
.opt.ok{animation:pp .4s}.opt.no{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chest{font-size:46px;line-height:1;animation:wob 1.6s infinite}@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.bar i{position:relative;overflow:hidden}.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:shn 2.4s infinite}@keyframes shn{to{transform:translateX(100%)}}

/* ---- animaciones ---- */
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes drift2{to{transform:translate(-30px,40px) scale(1.15)}}
@keyframes dt{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{0%{transform:translateY(14px);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
@keyframes tpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
@keyframes tglow{0%,18%,100%{transform:scale(1);background:var(--soft2);color:var(--pd)}6%,12%{transform:scale(1.22);background:var(--pd);color:#fff}}
@keyframes wave{0%,32%,100%{transform:none}14%{transform:translateY(-18px)}}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes heartup{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-110px) scale(1.2);opacity:0}}
@keyframes fillb{0%{width:6%}70%,100%{width:100%}}
@keyframes wrong{0%,3%{background:#fff;border-color:var(--line)}6%{background:var(--badbg);border-color:var(--bad);transform:translateX(-7px)}9%{transform:translateX(7px)}12%,26%{background:var(--badbg);border-color:var(--bad);transform:none}34%,100%{background:#fff;border-color:var(--line);transform:none}}
@keyframes right{0%,30%{background:#fff;border-color:var(--line)}36%{background:var(--okbg);border-color:var(--ok);color:#14573f;transform:scale(1.07)}42%,85%{background:var(--okbg);border-color:var(--ok);color:#14573f;transform:scale(1)}95%,100%{background:#fff;border-color:var(--line)}}
@keyframes slot{0%{background:var(--soft2);transform:scale(.8)}8%{background:var(--p2);transform:scale(1.18)}14%,86%{background:var(--p);transform:scale(1)}100%{background:var(--soft2);transform:scale(.8)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.18,1.1) rotate(4deg)}}
@keyframes ring{50%{outline-offset:5px}}
@keyframes halo{50%{transform:scale(1.18);opacity:.7}}
@keyframes bump{40%{transform:scale(1.22)}}
@keyframes rpop{40%{transform:scale(1.25)}}
.ct.act h2,.ct.act>.mu:not(.k),.ct.act>.mu.k{animation:up .6s both}
.ct.act>.mu:not(.k){animation-delay:.15s}
.act .wb{animation:drift 4.2s linear infinite;animation-delay:var(--d)}
.act .safe{animation:pp .6s 1s both}
.act .mg .ti{animation:tpop .55s both,tglow 5.4s infinite;animation-delay:calc(var(--i)*.1s),calc(var(--i)*.9s + .9s)}
.act .mq{animation:up .6s .2s both}
.act .bigpet{animation:bob 3s ease-in-out infinite}
.act .hz .hh{animation:heartup 2.6s ease-out infinite;animation-delay:var(--d)}

const CR={t:null,i:0,n:5,ms:3000,hold:0};
function bindCr(){const c=$('#cr');if(!c)return;clearTimeout(CR.t);CR.i=0;CR.hold=0;
 const w=()=>c.firstElementChild.offsetWidth+12,RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
 const dots=()=>document.querySelectorAll('.dots button');
 const tick=()=>{if(!$('#cr'))return;const left=CR.hold-Date.now();if(left>0){CR.t=setTimeout(tick,left+50);return}
  $('.dots').classList.remove('hold');set((CR.i+1)%CR.n,true)};
 function set(i,scroll){CR.i=i;[...c.children].forEach((e,j)=>e.classList.toggle('act',j===i));
  dots().forEach((b,j)=>{b.classList.remove('on');if(j===i){void b.offsetWidth;b.classList.add('on')}});
  if(scroll)c.scrollTo({left:i*w(),behavior:RM()?'auto':'smooth'});
  clearTimeout(CR.t);CR.t=setTimeout(tick,CR.ms)}
 const hold=()=>{CR.hold=Date.now()+5000;const d=$('.dots');d&&d.classList.add('hold')};
 CR.go=i=>{hold();set(i,true)};
 ['pointerdown','touchstart','wheel','keydown'].forEach(ev=>c.addEventListener(ev,hold,{passive:true}));
 c.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(CR.n-1,Math.round(c.scrollLeft/w())));if(i!==CR.i)set(i,false)},{passive:true});
 set(0,false)}

 if(force||Math.random()<.65)chat();else bubSay(['¿Sabías que cada historia me hace crecer? 🌱','Me gusta cuando cuentas cosas de tu infancia','Hoy es buen día para una historia ✨'][Math.floor(Math.random()*3)])}
function moodCard(){const m=S.pt.moods||[];if(!m.length)return'';const E=['','😢','😕','🙂','😄'],L='DLMXJVS';
 return `<section class="card"><h3>Tu ánimo esta semana</h3><div class="days">${Array.from({length:7},(_,i)=>{const dt=new Date(Date.now()-(6-i)*864e5),e=m.find(x=>x.d===dt.toDateString());return `<span style="${e?'font-size:20px;background:var(--soft2)':''}">${e?E[e.v]:L[dt.getDay()]}</span>`}).join('')}</div><p class="mu">${esc(S.pet.name)} lo recuerda cada vez que le cuentas cómo te fue.</p></section>`}

/* ---------- anuncios y membresía ---------- */
const ad=slot=>S.plan==='plus'?'':`<aside class="ad" aria-label="Publicidad" data-slot="${slot}"><span class="adk">Publicidad</span><div class="adb">Espacio para anuncio<small>${slot}</small></div><button class="lnk" style="min-height:32px;font-size:13px" onclick="planSheet()">Quitar anuncios con Plus</button></aside>`;
function planSheet(){const plus=S.plan==='plus',y=S.bill==='y';
 const rows=[['Anuncios','Sí','Ninguno'],['Miembros por grupo','6','20'],['Video','60 s','3 min'],['Cofre diario','x1','x2'],['Libro impreso','Precio normal','20% menos'],['Mascotas y accesorios','Básicos','Exclusivos']];
 showSheet(`<div class="ch"><span class="ti">${ic('crown',22)}</span><h2>Cápsula Plus</h2></div>
 <p class="mu">Para familias que quieren guardar más y sin anuncios.</p>
 ${plus?`<div class="q">Plan activo: Plus${S.trial?' · prueba gratis de 7 días':''}</div>`:`<div class="seg2"><button class="${y?'':'on'}" onclick="S.bill='m';planSheet()">Mensual</button><button class="${y?'on':''}" onclick="S.bill='y';planSheet()">Anual · ahorra 33%</button></div><div class="price">${y?'$119.000':'$14.900'}<small> COP / ${y?'año':'mes'}</small></div>`}
 <div class="cmp"><b></b><b>Gratis</b><b>Plus</b>${rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span><span class="pl2">${r[2]}</span>`).join('')}</div>
 ${plus?`<button class="btn s w" onclick="S.plan='free';S.trial=false;cl();render();toast('Volviste al plan gratis')">Volver al plan gratis</button>`:`<button class="btn w" onclick="goPlus()">Probar 7 días gratis</button>`}
 <p class="mu">Precios de ejemplo. El cobro real se conecta (Wompi, Mercado Pago o Google Play) al publicar la app.</p>`)}
function goPlus(){S.plan='plus';S.trial=true;cl();burst(40,['👑','✨','💗']);toast('¡Bienvenido a Plus!');render()}
function planCard(){return S.plan==='plus'?`<div class="card hero"><div class="row" style="gap:8px">${ic('crown',22)}<h3>Eres Cápsula Plus</h3></div><p class="mu">Sin anuncios, cofres dobles y videos de hasta 3 minutos.</p><button class="btn s w" onclick="planSheet()">Ver mi plan</button></div>`:`<div class="card hero"><div class="row" style="gap:8px">${ic('crown',22)}<h3>Cápsula Plus</h3></div><p class="mu">Sin anuncios, más miembros por grupo y videos más largos.</p><button class="btn w" onclick="planSheet()">Ver planes</button></div>`}
function helpCard(){if(S.demo||!S.group)return'';return `<div class="card"><h3>¿Tu familia aún no se une?</h3><p class="mu">Puedes empezar sin ellos. Tu mascota y tu diario funcionan solos, y todo se comparte cuando entren.</p><ul class="mu"><li>Invítalos con un mensaje listo para enviar.</li><li>Entrevístalos y publica la historia por ellos: al contar, escribe quién la cuenta.</li><li>${esc(S.pet.name)} te recordará invitarlos.</li></ul><a class="btn w" href="https://wa.me/?text=${encodeURIComponent('Te invito a nuestra familia en Cápsula 💗 Entra con el código '+S.group.code)}" target="_blank" rel="noopener">Enviar invitación por WhatsApp</a></div>`}

/* ---------- trivia ---------- */
function triv(){
 if(!S.demo)return `<h2>Trivia familiar</h2><div class="card c">${pet(S.pet.kind,90)}<h3>Se activa con tu familia</h3><p class="mu">La trivia mezcla frases de varios familiares y todos adivinan quién las dijo. Necesitas familiares con historias publicadas.</p><button class="btn w" onclick="go('fam')">Ir a Familia</button></div>`;
 if(T.i>=Q.length)return `<div class="card c">${pet(S.pet.kind,110)}<h2>¡Terminaste!</h2><p>Acertaste ${T.s} de ${Q.length}</p><p class="mu">${T.s===Q.length?'Perfecto, bono de 30 corazones':'Mañana hay trivia nueva'}</p><button class="btn" onclick="T={i:0,s:0,a:null};render()">Jugar otra vez</button></div>${ad('trivia')}`;
 const q=Q[T.i];
 return `<div class="card"><span class="mu">¿Quién vivió esto? Pregunta ${T.i+1} de ${Q.length}</span><p class="quote">${q.t}</p>
 ${q.o.map((o,j)=>{const st=T.a===null?'':(o===q.a?'ok':(j===T.a?'no':''));return `<button class="opt ${st}" onclick="ans(${j})">${o}${st==='ok'?ic('check',20):st==='no'?ic('x',20):''}</button>`}).join('')}
 ${T.a!==null?`<button class="btn" onclick="nx()">Siguiente</button>`:''}</div>`}
function ans(j){if(T.a!==null)return;T.a=j;if(Q[T.i].o[j]===Q[T.i].a){T.s++;burst(10,['✨','💗']);add(10)}else render()}
function nx(){T.i++;T.a=null;if(T.i>=Q.length&&T.s===Q.length){S.perfect=true;burst(44);add(30)}else render()}

/* ---------- archive ---------- */
function postBody(p){
 const x=p.x;
 if(['foto','dibujo','video'].includes(p.k)&&(!x.src||x.src.startsWith('blob:')&&!LIVE.has(x.src)))return '<p class="mu">Este archivo no se guardó en esta vista previa.</p>';
 if(p.k==='voz')return `<div class="aud"><button class="pl" onclick="toast('Reproduciendo (demo)')" aria-label="Reproducir">${ic('play',18)}</button><div class="wv">${bars(22)}</div><span class="mu">${esc(x.d)}</span></div>`;
 if(p.k==='foto')return `<img class="pimg" src="${x.src}" alt="${esc(p.t)}">${x.cap?`<p>${esc(x.cap)}</p>`:''}`;
 if(p.k==='dibujo')return `<img class="pimg" src="${x.src}" alt="Dibujo: ${esc(p.t)}">`;
 if(p.k==='video')return `<video class="pimg" src="${x.src}" controls playsinline preload="metadata"></video>${x.cap?`<p>${esc(x.cap)}</p>`:''}`;
 if(p.k==='carta')return `<div class="paperbox">${esc(x.tx)}</div>`;
 if(p.k==='receta')return `<div class="rcp">${x.by?`<span class="mu">Te la enseñó ${esc(x.by)}</span>`:''}<b>Ingredientes</b><ul>${x.ing.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><b>Preparación</b><p>${esc(x.stp)}</p></div>`;
 return ''}
function arc(){
 const n=S.posts.length;
 const head=`<h2>Archivo familiar</h2><div class="card"><span class="mu">Libro de la familia: ${Math.min(n,12)} de 12 historias</span><div class="bar"><i style="width:${Math.min(100,n/12*100)}%"></i></div></div>`;
 if(!n)return head+`<div class="card c">${pet(S.pet.kind,90)}<h3>Aún no hay historias</h3><p class="mu">Cuenta la primera y ${esc(S.pet.name)} te lo agradecerá.</p><button class="btn" onclick="chooser()">Contar la primera</button></div>`;
 return head+S.posts.map((p,ix)=>(ix===1||ix%4===3?ad('archivo-'+ix):'')+`<article class="card"><div class="row">${av(p.a)}<div class="tx"><b>${esc(p.t)}</b><span class="mu">${esc(who(p.a))} · ${p.when}${p.by?' · contada por '+esc(p.by):''}</span></div><span class="tag">${ic(TY[p.k].i,14)}${TY[p.k].l}</span></div>
  ${postBody(p)}
  <div class="rx">${['💗','😂','🥹'].map((e,j)=>`<button class="${p.m[j]?'on':''}" aria-pressed="${!!p.m[j]}" onclick="react(${p.id},${j})">${e} ${p.r[j]+p.m[j]}</button>`).join('')}</div></article>`).join('')}
function react(id,j){const p=S.posts.find(q=>q.id===id);if(p){p.m[j]=1-p.m[j];render()}}

/* ---------- family ---------- */
function fam(){
 if(!S.group)return `<h2>Tu familia</h2>${planCard()}<div class="card c">${pet(S.pet.kind,90)}<h3>Estás jugando solo</h3><p class="mu">Crea un grupo o únete a uno para compartir historias, ver la liga y jugar la trivia.</p><button class="btn w" onclick="S.scr='group';S.gstep='pick';render()">Crear o unirme a un grupo</button></div>`;
 const L=[...(S.demo?Object.keys(MEM).map(k=>({id:k,n:MEM[k].n,xp:MEM[k].xp})):[]),{id:'me',n:S.me.name+' (tú)',xp:S.xp}].sort((a,b)=>b.xp-a.xp);
 const B=[['pen','Primera historia',S.posts.some(p=>p.a==='me')],['flame','Racha de 3',S.streak>=3],['brush','Multiformato',S.types.size>=3],['star','Trivia perfecta',S.perfect],['users','Invitador',!!S.inv],['book','Libro listo',S.posts.length>=12]];
 return `<h2>${esc(S.group.name)}</h2>
 ${planCard()}
 <div class="card"><span class="mu">Código del grupo</span><div class="code">${S.group.code}</div>
  <button class="btn w" onclick="S.inv=1;copy('Únete a mi familia en Cápsula con el código ${S.group.code}');render()">Invitar a un familiar</button>
  <a class="btn s w" href="https://wa.me/?text=${encodeURIComponent('Te invito a nuestra familia en Cápsula 💗 Entra con el código '+S.group.code)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>
  ${S.demo?'':`<button class="btn s w" onclick="loadDemo()">Probar con una familia de ejemplo</button>`}</div>
${helpCard()}
 <div class="card"><h3>Liga de la familia</h3><span class="mu">Se reinicia en 3 días</span>
  ${L.map((r,i)=>`<div class="row sp"><div class="row"><span class="rk ${i===0?'g':''}">${i+1}</span>${av(r.id,40)}<b>${esc(r.n)}</b></div><span class="row" style="gap:4px">${r.xp}${ic('heart',14)}</span></div>`).join('')}</div>
${ad('familia')}
 <div class="card"><h3>Insignias</h3><div class="bd">${B.map(b=>`<div class="${b[2]?'':'lk'}">${ic(b[0],28)}${b[1]}</div>`).join('')}</div></div>`}
function loadDemo(){if(!S.demo){S.demo=true;S.posts=S.posts.concat(demoPosts())}toast('Familia de ejemplo cargada');render()}
const _f=fam;fam=()=>_f()+'<button class="btn s w" onclick="logout()">Cerrar sesión</button>';
const VIEW={home,triv,arc,fam};

/* ---------- publish ---------- */
function showSheet(h){const s=$('#sh');s.innerHTML=`<div class="pn" role="dialog" aria-modal="true"><button class="x" onclick="cl()" aria-label="Cerrar">${ic('x',18)}</button>${h}</div>`;s.classList.add('open')}
function cl(){clearInterval(C.tm);$('#sh').classList.remove('open')}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')cl()});
function chooser(p){S.prompt=p||null;
 showSheet(`<h2>${p?'Responder la pregunta':'¿Cómo quieres contarlo?'}</h2>${p?`<p class="q">${esc(p)}</p>`:'<p class="mu">Elige la forma que más te guste.</p>'}
 <div class="tg">${Object.entries(TY).map(([k,v])=>`<button class="tile" onclick="compose('${k}')"><span class="ti">${ic(v.i,24)}</span><b>${v.l}</b><span class="mu">${v.h}</span></button>`).join('')}</div>`)}
function compose(k){
 C={k,ph:0,sec:0,ok:false,drawn:false,url:null,col:'#ff8dbb',sz:8};
 const v=TY[k],pr=S.prompt?`<p class="q">${esc(S.prompt)}</p>`:'';
 const head=`<div class="ch"><span class="ti">${ic(v.i,22)}</span><h2>${v.l}</h2></div>${pr}<label class="lb" for="by2">¿Quién la cuenta? (opcional)</label><input id="by2" class="in" maxlength="30" placeholder="Yo, o por ejemplo: Abuela Rosa">`;
 const go=`<button class="btn w" id="go" onclick="doPub('${k}')" disabled>Publicar en la familia</button>`;
 const ttl=ph=>`<label class="lb" for="ttl">Título</label><input id="ttl" class="in" maxlength="60" placeholder="${ph}" oninput="chk()">`;
 const B={
  voz:`<div id="vb">${voz()}</div>`,
  foto:`<label class="drop" for="ph-f"><span class="ti">${ic('camera',24)}</span><b>Elegir una foto</b><span class="mu">De tu galería o de la cámara</span></label><input id="ph-f" type="file" accept="image/*" hidden onchange="pick(this,'img')"><img id="pv" class="pv" alt="Vista previa de tu foto" hidden>${ttl('Ponle un nombre al recuerdo')}<label class="lb" for="cap">¿Qué pasó ahí?</label><textarea id="cap" class="in" rows="3" maxlength="300" placeholder="Cuenta quiénes salen y qué recuerdas"></textarea>${go}`,
  carta:`<label class="lb" for="to">Para</label><input id="to" class="in" maxlength="40" placeholder="Toda la familia"><label class="lb" for="tx">Tu carta</label><textarea id="tx" class="in paper" rows="7" maxlength="800" placeholder="Querida familia..." oninput="chk()"></textarea>${go}`,
  dibujo:`<canvas id="cv" class="cv" width="600" height="440" aria-label="Lienzo para dibujar"></canvas><div class="tools"><div class="row" style="gap:8px">${[['#ff8dbb','Rosa'],['#c43d7a','Fucsia'],['#ffb1d0','Rosa pastel'],['#7ccfae','Verde'],['#7fb8f5','Azul'],['#4a2336','Ciruela'],['#ffffff','Borrador']].map((c,i)=>`<button class="swb ${i?'':'on'}" style="background:${c[0]}" data-c="${c[0]}" onclick="setCol(this)" aria-label="${c[1]}"></button>`).join('')}</div><div class="row" style="gap:8px">${[4,8,16].map((s,i)=>`<button class="szb ${i===1?'on':''}" onclick="setSz(this,${s})" aria-label="Grosor ${s}"><i style="width:${s+2}px;height:${s+2}px"></i></button>`).join('')}<button class="btn s" onclick="clr()">Borrar todo</button></div></div>${ttl('Ponle un nombre a tu dibujo')}${go}`,
  video:`<label class="drop" for="vd-f"><span class="ti">${ic('video',24)}</span><b>Elegir o grabar un video</b><span class="mu">Hasta ${S.plan==='plus'?'3 minutos':'60 segundos'}</span></label><input id="vd-f" type="file" accept="video/*" hidden onchange="pick(this,'vid')"><video id="pv" class="pv" controls playsinline hidden></video><p class="err" id="err"></p>${ttl('Ponle un nombre a tu video')}<label class="lb" for="cap">¿Qué cuenta el video?</label><textarea id="cap" class="in" rows="2" maxlength="300"></textarea>${go}`,
  receta:`<label class="lb" for="ttl">Nombre del plato</label><input id="ttl" class="in" maxlength="60" placeholder="Sancocho del domingo" oninput="chk()"><label class="lb" for="by">¿Quién te la enseñó?</label><input id="by" class="in" maxlength="40" placeholder="Abuela Rosa"><label class="lb" for="ing">Ingredientes (uno por línea)</label><textarea id="ing" class="in" rows="4" oninput="chk()"></textarea><label class="lb" for="stp">Preparación</label><textarea id="stp" class="in" rows="4" oninput="chk()"></textarea>${go}`
 };
 showSheet(head+B[k]);if(k==='dibujo')initDraw();
}
function chk(){const g=$('#go');if(!g)return;const v=id=>{const e=$('#'+id);return e?e.value.trim():''};let ok=false;
 switch(C.k){case 'foto':ok=!!C.url;break;case 'video':ok=!!C.url&&C.ok;break;case 'dibujo':ok=C.drawn;break;case 'carta':ok=v('tx').length>=10;break;case 'receta':ok=!!(v('ttl')&&v('ing')&&v('stp'));break}
 g.disabled=!ok}
function pick(i,t){const f=i.files&&i.files[0];if(!f)return;C.url=URL.createObjectURL(f);LIVE.add(C.url);const e=$('#pv');e.hidden=false;e.src=C.url;
 if(t==='vid'){C.ok=false;$('#err').textContent='';e.onloadedmetadata=()=>{C.ok=e.duration<=(S.plan==='plus'?181:61);$('#err').textContent=C.ok?'':'El video dura más de '+(S.plan==='plus'?'3 minutos':'60 segundos')+'. Elige uno más corto'+(S.plan==='plus'?'.':' o pasa a Plus.');chk()};e.onerror=()=>{C.ok=false;$('#err').textContent='No se pudo abrir ese video. Prueba con otro archivo.';chk()}}
 else{C.ok=true;shrink(f)}chk()}
function shrink(f){const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);C.url=c.toDataURL('image/jpeg',.7);const e=$('#pv');if(e)e.src=C.url};im.src=URL.createObjectURL(f)}

/* voice (simulated recording) */
function voz(){
 if(C.ph===2)return `<div class="clip"><div class="wv">${bars(16)}</div><p>“Esto fue lo que pasó aquella mañana, y todavía nos reímos cuando lo recordamos.”</p></div><p class="mu">Así se verá la transcripción automática (texto de ejemplo en esta vista previa).</p><button class="btn w" onclick="doPub('voz')">Publicar en la familia</button>`;
 return `<p class="mu">${C.ph?'Grabando. Toca para terminar.':'Toca el micrófono y cuéntalo a tu manera.'}</p><div class="wv ${C.ph?'go':''}">${bars(16,true)}</div><div id="tm" class="tm">${fmt(C.sec)}</div><div class="c"><button class="mic ${C.ph?'rc':''}" onclick="tg()" aria-label="${C.ph?'Detener':'Grabar'}">${ic(C.ph?'stop':'mic',34)}</button></div>`}
function tg(){
 if(!C.ph){C.ph=1;C.sec=0;$('#vb').innerHTML=voz();C.tm=setInterval(()=>{C.sec++;const e=$('#tm');if(e)e.textContent=fmt(C.sec)},1000)}
 else{clearInterval(C.tm);C.ph=2;$('#vb').innerHTML=voz()}}

/* drawing */
function initDraw(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineCap='round';x.lineJoin='round';
 let d=false,l=null;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;l=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.fillStyle=C.col;x.beginPath();x.arc(l[0],l[1],C.sz/2,0,7);x.fill();mark()};
 c.onpointermove=e=>{if(!d)return;const p=pt(e);x.strokeStyle=C.col;x.lineWidth=C.sz;x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();l=p};
 c.onpointerup=c.onpointercancel=()=>{d=false};
 function mark(){if(!C.drawn){C.drawn=true;chk()}}
}
function setCol(b){C.col=b.dataset.c;document.querySelectorAll('.swb').forEach(e=>e.classList.toggle('on',e===b))}
function setSz(b,s){C.sz=s;document.querySelectorAll('.szb').forEach(e=>e.classList.toggle('on',e===b))}
function clr(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);C.drawn=false;chk()}

function doPub(k){
 const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
 const p={id:Date.now(),k,a:'me',when:'ahora',r:[0,0,0],m:[0,0,0],t:'',x:{}};
 if(k==='voz'){p.t=S.prompt||'Nota de voz';p.x={d:fmt(C.sec||42)}}
 if(k==='foto'){p.t=g('ttl')||S.prompt||'Foto sin título';p.x={src:C.url,cap:g('cap')}}
 if(k==='video'){p.t=g('ttl')||S.prompt||'Video corto';p.x={src:C.url,cap:g('cap')}}
 if(k==='dibujo'){p.t=g('ttl')||S.prompt||'Mi dibujo';p.x={src:$('#cv').toDataURL('image/png')}}
 if(k==='carta'){const to=g('to')||'Toda la familia';p.t='Carta para '+to;p.x={to,tx:g('tx')}}
 if(k==='receta'){p.t=g('ttl');p.x={by:g('by'),ing:g('ing').split('\n').map(s=>s.trim()).filter(Boolean),stp:g('stp')}}
 {const by=g('by2');if(by)p.by=by}
 S.posts.unshift(p);S.types.add(k);
 if(!S.posted){S.posted=true;S.streak++;S.last=today();setTimeout(()=>{toast('🔥 ¡Racha de '+S.streak+(S.streak>1?' días':' día')+'!');burst(26,['🔥','✨'])},1100)}
 S.prompt=null;cl();S.tab='arc';add(TY[k].xp);
}

load();render();setInterval(petIdle,20000);setTimeout(()=>petIdle(true),5000);
</script>
