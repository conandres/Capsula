name: Construir app Android

# Se ejecuta a mano desde la pestaña Actions ("Run workflow").
# Genera UNA sola versión: firmada con la llave de tienda. Se publica como borrador privado (solo la ves tú).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar la web a www
        run: |
          mkdir -p www
          cp -r index.html cloud.js config.js manifest.json icons img lab3d legal www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Íconos de la app y de las notificaciones
        run: |
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          cp -r ci/android-res/* android/app/src/main/res/

      - name: Archivo google-services.json (secreto)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::error::Falta el secreto GOOGLE_SERVICES_JSON"; exit 1; fi
          printf '%s' "$GSJ" > android/app/google-services.json

      - name: Llave de tienda (secretos) y configuración de firma
        env:
          RELKS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          REL_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -z "$RELKS" ] || [ -z "$REL_PW" ]; then echo "::error::Faltan los secretos RELEASE_KEYSTORE_B64 y RELEASE_KEYSTORE_PASSWORD"; exit 1; fi
          printf '%s' "$RELKS" | tr -d ' \r\n"' | base64 -d > android/app/release.keystore
          python3 ci/patch-gradle.py

      - name: Compilar APK y paquete AAB firmados
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Preparar archivos
        run: |
          mkdir -p tienda
          cp android/app/build/outputs/apk/release/app-release.apk tienda/Capsula.apk
          cp android/app/build/outputs/bundle/release/app-release.aab tienda/Capsula.aab
          keytool -printcert -jarfile tienda/Capsula.apk | tee firma.txt
          grep -q "05:1D:86:8F:29:71" firma.txt || { echo "::error::El APK no quedó firmado con la llave de tienda"; exit 1; }

      - name: Guardar copia como artefacto (privado)
        uses: actions/upload-artifact@v4
        with:
          name: capsula-apk
          path: tienda/Capsula.apk
          retention-days: 7

      - name: Publicar (borrador privado, siempre el mismo)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capsula-firmada
          name: Cápsula Android (versión firmada)
          draft: true
          body: "Única versión: APK y AAB firmados con la llave de tienda. Para Samsung Galaxy Store, AppGallery y Google Play."
          files: |
            tienda/Capsula.apk
            tienda/Capsula.aab
