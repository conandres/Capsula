name: Construir app Android

# Se ejecuta a mano desde la pestaña Actions ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar la web a www
        run: |
          mkdir -p www
          cp -r index.html cloud.js config.js manifest.json icons lab3d legal www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Íconos de la app y de las notificaciones
        run: |
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          cp -r ci/android-res/* android/app/src/main/res/

      - name: Archivo google-services.json (secreto)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::error::Falta el secreto GOOGLE_SERVICES_JSON"; exit 1; fi
          printf '%s' "$GSJ" > android/app/google-services.json

      - name: Llave de tienda (si existe el secreto) y firma de depuración fija
        env:
          RELKS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          REL_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -n "$RELKS" ] && [ -n "$REL_PW" ]; then printf '%s' "$RELKS" | tr -d ' \r\n"' | base64 -d > android/app/release.keystore; echo "HAY_TIENDA=1" >> $GITHUB_ENV; else export REL_PW=""; fi
          cp ci/debug.keystore android/app/debug.keystore
          python3 ci/patch-gradle.py

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar versión de tienda (APK firmado y paquete AAB)
        if: env.HAY_TIENDA == '1'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Preparar archivos de tienda
        if: env.HAY_TIENDA == '1'
        run: |
          mkdir -p tienda
          cp android/app/build/outputs/apk/release/app-release.apk tienda/Capsula-tienda.apk
          cp android/app/build/outputs/bundle/release/app-release.aab tienda/Capsula-tienda.aab
          keytool -printcert -jarfile tienda/Capsula-tienda.apk | grep -E "SHA1|SHA-1" || true

      - name: Publicar versión de tienda
        if: env.HAY_TIENDA == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-tienda
          name: Cápsula Android (para tiendas)
          draft: true
          prerelease: true
          body: "APK y AAB firmados con la llave de tienda. Para subir a Samsung Galaxy Store, AppGallery y Google Play."
          files: |
            tienda/Capsula-tienda.apk
            tienda/Capsula-tienda.aab

      - name: Comprobar la firma del APK
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | tee firma.txt
          grep -q "36:22:E8:D4:1C:A8" firma.txt || { echo "::error::El APK no quedó firmado con la llave fija"; exit 1; }

      - name: Publicar APK descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Cápsula Android (prueba)
          prerelease: true
          body: "APK de prueba. Descárgalo desde el teléfono e instálalo."
          files: android/app/build/outputs/apk/debug/app-debug.apk
