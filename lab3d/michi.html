<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michi 2.0 · vista previa</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root{--bg:#f4eefc;--ink:#2a2140;--ac:#6a4cd6;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px 4px}h1{margin:0;font-size:20px}p{margin:4px 0;color:#6b6283;font-size:13px}
#v{width:100%;height:56vh;min-height:320px;touch-action:none;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px}
button{border:0;border-radius:99px;padding:9px 14px;background:var(--card);color:var(--ink);font:inherit;box-shadow:0 1px 4px #0002;min-height:40px}
button.on{background:var(--ac);color:#fff}
h2{font-size:13px;margin:10px 16px 0;color:#6b6283;text-transform:uppercase;letter-spacing:.04em}
#msg{margin:8px 16px;padding:8px 12px;border-radius:12px;background:#fff;font-size:13px;white-space:pre-wrap}
</style></head><body>
<header><h1>Michi 2.0 · vista previa</h1><p>Arrastra para girar. Solo para revisar el modelo; todavía no está en la app.</p></header>
<canvas id="v"></canvas>
<h2>Etapa</h2><div class="bar" id="st"></div>
<h2>Modelo</h2><div class="bar" id="rg"></div>
<h2>Animaciones del archivo</h2><div class="bar" id="an"></div>
<h2>Sonidos</h2><div class="bar" id="so"></div>
<div id="msg">Cargando…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t};
addEventListener('error',e=>msg('Error: '+e.message));addEventListener('unhandledrejection',e=>msg('Error: '+(e.reason&&e.reason.message||e.reason)));
const cv=$('v'),r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0xb9a8d8,2.1));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(2,4,5);sc.add(dl);
const cam=new THREE.PerspectiveCamera(32,1,.01,100);
const pivot=new THREE.Group();sc.add(pivot);
const floor=new THREE.Mesh(new THREE.CircleGeometry(1,48),new THREE.MeshBasicMaterial({color:0x6a4cd6,transparent:true,opacity:.1}));floor.rotation.x=-Math.PI/2;sc.add(floor);
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let st='bebe',rig=false,mixer=null,cur=null,model=null,yaw=0,drag=null,sound=null;
const loader=new GLTFLoader(),clock=new THREE.Clock(),cache={};
const ST=[['bebe','Bebé'],['juvenil','Juvenil'],['adulto','Adulto']];
function btns(box,items,fn,sel){box.innerHTML='';items.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.className=sel&&sel(k)?'on':'';b.onclick=()=>fn(k,b);box.appendChild(b)})}
function drawBars(){btns($('st'),ST,k=>{st=k;load()},k=>k===st);btns($('rg'),[[0,'Sin esqueleto (liviano)'],[1,'Con esqueleto']],k=>{rig=!!k;load()},k=>!!k===rig)}
async function load(){drawBars();msg('Cargando '+st+(rig?' (esqueleto)':'')+'…');
 const url='./michi/michi_'+st+(rig?'_rig':'')+'_v2.glb';
 try{const g=cache[url]||(cache[url]=await loader.loadAsync(url));
  if(model)pivot.remove(model);model=g.scene;pivot.add(model);
  const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  model.position.sub(c);model.position.y+=s.y/2-(c.y-b.min.y)*0+0;
  const bb=new THREE.Box3().setFromObject(model);model.position.y-=bb.min.y;pivot.position.y=-s.y/2;
  floor.scale.setScalar(Math.max(s.x,s.z)*.7);floor.position.y=-s.y/2+.002;
  const d=Math.max(s.y,s.x)*1.25/Math.tan(THREE.MathUtils.degToRad(cam.fov/2));cam.position.set(0,s.y*.05,d*1.05);cam.lookAt(0,0,0);
  mixer=new THREE.AnimationMixer(model);const clips=g.animations||[];
  btns($('an'),clips.map(c=>[c.name,c.name.replace(/^Michi_|^Rig_/,'').replace(/_/g,' ')]),k=>play(clips.find(c=>c.name===k)));
  const idle=clips.find(c=>/Idle/.test(c.name));if(idle)play(idle);
  msg(`${ST.find(x=>x[0]===st)[1]}: ${s.x.toFixed(2)} × ${s.y.toFixed(2)} × ${s.z.toFixed(2)} · ${clips.length} animaciones · ${rig?'con':'sin'} esqueleto`)}
 catch(e){msg('No se pudo cargar el modelo: '+(e&&e.message||e))}}
function play(c){if(!mixer||!c)return;const a=mixer.clipAction(c);if(cur&&cur!==a)cur.fadeOut(.2);a.reset().fadeIn(.2).play();cur=a}
const SO=[['caricia','Caricia'],['michi_feliz','Feliz'],['ronroneo','Ronroneo'],['comer','Comer'],['pidiendo_comida','Pide comida'],['dormir','Dormir'],['caminar','Caminar'],['celebracion','Celebración'],['evolucion_magica','Evolución']];
btns($('so'),SO,k=>{try{if(sound)sound.pause();sound=new Audio('./michi/audio/'+k+'.wav');sound.volume=.6;sound.play().catch(e=>msg('El navegador bloqueó el sonido: '+e.message))}catch(e){msg(String(e))}});
cv.addEventListener('pointerdown',e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag!=null){yaw+=(e.clientX-drag)*.01;drag=e.clientX}});cv.addEventListener('pointerup',()=>drag=null);
r.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);if(drag==null)yaw+=dt*.35;pivot.rotation.y=yaw;r.render(sc,cam)});
load();
</script></body></html>
